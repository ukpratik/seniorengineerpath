# Checks, builds, tests and deploys SeniorPath (LLD §9). Actions are pinned to commit SHAs.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx astro check
      - run: npm test
      - run: npm run build # content gate + site + search index
      - run: npm run export:app # Android app content (ADR-007): fails on Markdown the app can't draw
      - name: JS budget (NFR-002)
        run: node scripts/js-budget.mjs
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - name: Lighthouse (NFR-001, NFR-003)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 3

  android:
    # The Android app (ADR-007): content export, then unit tests, lint and both builds. No signing in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run export:app
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :content:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
        working-directory: android
  deploy:
    needs: build-test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No Cloudflare token yet; skipping deploy."; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.secrets.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seniorpath --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
