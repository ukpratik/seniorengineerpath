id: ack-lost-dedupe
title: "The ack is lost after the work: the broker redelivers, the dedupe table stops the second charge"
viewBox: 0 0 340 470
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="456"/><line class="life" x1="170" y1="54" x2="170" y2="456"/><line class="life" x1="285" y1="54" x2="285" y2="456"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Broker</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">Consumer</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Database</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="92" x2="166" y2="92"/><text class="lb" x="112" y="83">deliver m42</text><text class="sub" x="112" y="109">charge order 7 · ₹1,499</text></g>
  <g class="f" data-f="2"><line class="ln" x1="172" y1="140" x2="281" y2="140"/><text class="lb" x="227" y="131">one transaction</text><rect class="rec" x="238" y="150" width="94" height="26" rx="7"/><text class="rec-t" x="285" y="167">+ m42 seen</text><rect class="rec" x="238" y="180" width="94" height="26" rx="7"/><text class="rec-t" x="285" y="197">+ charge</text><text class="sub" x="285" y="224">COMMIT ✓</text></g>
  <g class="f" data-f="3"><line class="ln lost" x1="168" y1="256" x2="59" y2="256"/><text class="lb" x="112" y="246">ack m42</text><path class="xm" d="M105 249l14 14M119 249l-14 14"/><text class="sub badt" x="112" y="282">ack lost</text><rect class="note" x="8" y="292" width="94" height="26" rx="7"/><text class="note-t" x="55" y="309">no ack: retry</text></g>
  <g class="f" data-f="4"><line class="ln" x1="57" y1="346" x2="166" y2="346"/><text class="lb" x="112" y="337">deliver m42</text><text class="sub" x="112" y="363">same message ID</text></g>
  <g class="f" data-f="5"><line class="ln" x1="172" y1="384" x2="281" y2="384"/><text class="lb" x="227" y="375">insert m42</text><text class="sub badt" x="285" y="402">conflict: 0 rows</text><line class="ln" x1="168" y1="426" x2="59" y2="426"/><text class="lb" x="112" y="417">ack m42</text><rect class="okb" x="186" y="420" width="148" height="30" rx="8"/><text class="ok-t" x="260" y="440">✓ charged once</text></g>
captions:
  - "The broker delivers message m42 to the consumer. The message asks it to charge order 7. It carries a unique message ID."
  - "In one database transaction, the consumer records that it has seen m42 and saves the charge. The transaction commits. The work is done."
  - "The consumer sends its ack, but the ack is lost, or the consumer crashes first. The broker cannot tell this apart from a message that was never handled."
  - "So the broker does the only safe thing. It delivers m42 again, with the same message ID."
  - "The insert of m42 hits the unique key and adds 0 rows. The consumer skips the work and acks. The order is charged once."
