id: burn-rate-windows
title: "Three burn-rate rules meet a fast, a slow and a tiny burn"
viewBox: 0 0 340 452
svg: |
  <text class="lb" x="170" y="16">SLO 99.9% over 30 days · budget 0.1%</text>
  <g class="f" data-f="1"><rect class="box" x="20" y="28" width="300" height="70" rx="10"/><text class="bt" x="170" y="47">Three rules, each with two windows</text><text class="sub" x="170" y="66">A: 1 h and 5 min ≥ 14.4 → page</text><text class="sub" x="170" y="81">B: 6 h and 30 min ≥ 6 → page</text><text class="sub" x="170" y="94">C: 3 days and 6 h ≥ 1 → ticket</text></g>
  <g class="f" data-f="2"><line class="ln" x1="170" y1="100" x2="170" y2="112"/><rect class="note" x="20" y="116" width="300" height="52" rx="10"/><text class="note-t" x="170" y="138">Fast burn: 15% errors (burn 150)</text><text class="sub" x="170" y="157">5 min window over at once · 1 h after ~6 min</text></g>
  <g class="f" data-f="3"><line class="ln" x1="170" y1="170" x2="170" y2="182"/><rect class="rec" x="20" y="186" width="300" height="52" rx="10"/><text class="rec-t" x="170" y="208">Rule A pages</text><text class="sub" x="170" y="227">about 2% of the budget is spent</text></g>
  <g class="f" data-f="4"><line class="ln" x1="170" y1="240" x2="170" y2="252"/><rect class="okb" x="20" y="256" width="300" height="52" rx="10"/><text class="ok-t" x="170" y="278">Roll back: alert clears in ≤ 5 min</text><text class="sub" x="170" y="297">the 1 h window alone stays high much longer</text></g>
  <g class="f" data-f="5"><line class="ln" x1="170" y1="310" x2="170" y2="322"/><rect class="note" x="20" y="326" width="300" height="52" rx="10"/><text class="note-t" x="170" y="348">Slow burn: 0.8% errors (burn 8)</text><text class="sub" x="170" y="367">A never fires · B pages after 4.5 h (5% spent)</text></g>
  <g class="f" data-f="6"><line class="ln" x1="170" y1="380" x2="170" y2="392"/><rect class="box" x="20" y="396" width="300" height="52" rx="10"/><text class="bt" x="170" y="418">Tiny burn: 0.15% errors (burn 1.5)</text><text class="sub" x="170" y="437">C opens a ticket after 2 days (10% spent)</text></g>
captions:
  - "The checkout SLO allows 0.1% errors over 30 days. The team uses the three rules from the SRE Workbook. Each rule fires only when a long and a short window both pass the same burn rate."
  - "Before the deploy there were almost no errors. Now 15% of requests fail. That is a burn rate of 15 ÷ 0.1 = 150. The 5-minute error rate passes 1.44% (burn rate 14.4) within about 30 seconds. The 1-hour error rate needs about 6 minutes to reach 1.44% (1.44 ÷ 15 × 60 ≈ 5.8). The Workbook rounds this to 5 minutes."
  - "Both windows of rule A are now over 14.4, so the on-call engineer is paged. About 6 minutes at burn rate 150 spend about 2% of the 30-day budget."
  - "The engineer rolls back and errors stop. The 5-minute average drops below 14.4 within 5 minutes, so the page clears. With only the 1-hour window, the alert could keep firing for close to an hour."
  - "Another day, a bug fails 0.8% of requests. That is burn rate 8. Rule A never fires, because 8 is below 14.4. The 6-hour average reaches 0.6% after 4.5 hours, so rule B pages. By then 5% of the budget is gone."
  - "A third bug fails only 0.15% of requests: burn rate 1.5. No rule pages. After 2 days, the 3-day average passes 0.1%, so rule C opens a ticket. That is 10% of the budget, and a human can fix it in work hours."
