id: cache-lease-stale-set
title: "A slow reader puts old data back in the cache, and how a lease stops it"
viewBox: 0 0 340 400
svg: |
  <line class="life" x1="42" y1="50" x2="42" y2="390"/><line class="life" x1="128" y1="50" x2="128" y2="390"/><line class="life" x1="214" y1="50" x2="214" y2="390"/><line class="life" x1="300" y1="50" x2="300" y2="390"/>
  <rect class="box" x="4" y="10" width="76" height="40" rx="9"/><text class="bt" x="42" y="35">Reader A</text>
  <rect class="box" x="90" y="10" width="76" height="40" rx="9"/><text class="bt" x="128" y="35">Cache</text>
  <rect class="box" x="176" y="10" width="76" height="40" rx="9"/><text class="bt" x="214" y="35">Database</text>
  <rect class="box" x="262" y="10" width="76" height="40" rx="9"/><text class="bt" x="300" y="35">Writer B</text>
  <g class="f" data-f="1"><line class="ln" x1="44" y1="80" x2="124" y2="80"/><text class="lb" x="85" y="72">get k</text><line class="ln" x1="126" y1="104" x2="46" y2="104"/><text class="lb" x="85" y="98">miss + lease L1</text></g>
  <g class="f" data-f="2"><line class="ln" x1="44" y1="132" x2="210" y2="132"/><text class="lb" x="128" y="125">read k</text><line class="ln" x1="212" y1="154" x2="46" y2="154"/><text class="lb" x="128" y="148">v1</text><text class="sub" x="42" y="174">A is slow…</text></g>
  <g class="f" data-f="3"><line class="ln" x1="298" y1="198" x2="218" y2="198"/><text class="lb" x="258" y="191">write v2</text><line class="ln" x1="298" y1="226" x2="132" y2="226"/><text class="lb" x="214" y="220">delete k</text><rect class="note" x="90" y="236" width="76" height="24" rx="7"/><text class="note-t" x="128" y="252">L1 cancelled</text></g>
  <g class="f" data-f="4"><line class="ln" x1="44" y1="290" x2="124" y2="290"/><text class="lb" x="85" y="283">set k = v1</text><text class="sub badt" x="170" y="312">No lease: old v1 stays until its TTL</text></g>
  <g class="f" data-f="5"><path class="xm" d="M140 280l14 14M154 280l-14 14"/><rect class="okb" x="20" y="328" width="300" height="28" rx="8"/><text class="ok-t" x="170" y="347">✓ With L1: set rejected</text><text class="sub" x="170" y="376">The next reader misses and loads v2.</text></g>
captions:
  - "Reader A asks the cache for key k and misses. The cache gives A a lease: a token that A must show when it puts a value back."
  - "A reads the database and gets v1. Then A is slow for a moment, for example because of a long pause or a slow network."
  - "Writer B updates the database to v2 and deletes k from the cache. The delete also cancels A's lease, L1."
  - "A finally sends set k = v1. Without leases the cache accepts it. Now the cache holds old data. It stays until the TTL ends or the next write deletes it."
  - "With leases, the cache checks L1, sees it was cancelled, and rejects the set. The next reader misses and loads v2."
