id: cache-stampede
title: "A hot key expires: a stampede, then the same moment with request coalescing"
viewBox: 0 0 340 460
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="446"/><line class="life" x1="170" y1="54" x2="170" y2="446"/><line class="life" x1="285" y1="54" x2="285" y2="446"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Requests</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">Cache</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Database</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="88" x2="166" y2="88"/><text class="lb" x="112" y="79">GET product:42</text><text class="sub" x="112" y="105">5,000 per second</text><rect class="rec" x="122" y="114" width="96" height="26" rx="7"/><text class="rec-t" x="170" y="131">product:42</text><text class="sub" x="285" y="131">quiet</text></g>
  <g class="f" data-f="2"><path class="xm" d="M196 112l14 14M210 112l-14 14"/><rect class="note" x="122" y="148" width="96" height="24" rx="7"/><text class="note-t" x="170" y="165">TTL ended</text></g>
  <g class="f" data-f="3"><line class="ln" x1="57" y1="196" x2="281" y2="196"/><line class="ln" x1="57" y1="208" x2="281" y2="208"/><line class="ln" x1="57" y1="220" x2="281" y2="220"/><text class="lb" x="112" y="188">miss × 1,000</text><rect class="note" x="240" y="228" width="90" height="26" rx="7"/><text class="note-t" x="285" y="246">overloaded</text><text class="sub badt" x="140" y="272">A · same query, 1,000 times</text></g>
  <g class="f" data-f="4"><line class="life" x1="8" y1="288" x2="332" y2="288"/><text class="lb" x="170" y="310">B · coalescing or a lease</text><line class="ln" x1="57" y1="336" x2="281" y2="336"/><text class="sub" x="112" y="328">1 query</text><text class="sub" x="112" y="353">999 others wait</text></g>
  <g class="f" data-f="5"><line class="ln" x1="283" y1="374" x2="174" y2="374"/><text class="lb" x="227" y="366">set product:42</text><line class="ln" x1="168" y1="398" x2="59" y2="398"/><text class="lb" x="112" y="391">same answer</text><rect class="okb" x="70" y="412" width="200" height="30" rx="8"/><text class="ok-t" x="170" y="432">✓ 1 query, not 1,000</text></g>
captions:
  - "A popular product key sits in the cache. 5,000 requests a second read it, and almost none reach the database."
  - "The key's TTL ends, and the cache drops it. The next requests will all miss."
  - "Path A, no protection. About 1,000 requests miss before the first reload finishes. Each runs the same query, and the database is overloaded."
  - "Path B, with a lease in the shared cache (or coalescing, if there is one server). Only the first request that misses loads the key. The other 999 wait for that one answer."
  - "The one query returns. The value goes back into the cache, and every waiting request gets the same answer. The database ran 1 query, not 1,000."
