id: composite-index-scan
title: "One index on (customer_id, created_at): a fast range, a query it cannot help, and a covering index"
viewBox: 0 0 340 470
svg: |
  <text class="lb" x="170" y="16">Index on (customer_id, created_at)</text>
  <g class="f" data-f="1"><rect class="box" x="10" y="26" width="50" height="36" rx="6"/><text class="bt" x="35" y="41">7</text><text class="sub" x="35" y="56">May 1</text><rect class="box" x="64" y="26" width="50" height="36" rx="6"/><text class="bt" x="89" y="41">7</text><text class="sub" x="89" y="56">May 9</text><rect class="box" x="118" y="26" width="50" height="36" rx="6"/><text class="bt" x="143" y="41">42</text><text class="sub" x="143" y="56">May 2</text><rect class="box" x="172" y="26" width="50" height="36" rx="6"/><text class="bt" x="197" y="41">42</text><text class="sub" x="197" y="56">May 6</text><rect class="box" x="226" y="26" width="50" height="36" rx="6"/><text class="bt" x="251" y="41">42</text><text class="sub" x="251" y="56">May 9</text><rect class="box" x="280" y="26" width="50" height="36" rx="6"/><text class="bt" x="305" y="41">58</text><text class="sub" x="305" y="56">May 8</text><text class="sub" x="170" y="80">sorted by customer, then by date</text></g>
  <g class="f" data-f="2"><text class="lb" x="170" y="108">A · customer 42, since May 6</text><rect class="box" x="10" y="118" width="50" height="36" rx="6"/><text class="bt" x="35" y="133">7</text><text class="sub" x="35" y="148">May 1</text><rect class="box" x="64" y="118" width="50" height="36" rx="6"/><text class="bt" x="89" y="133">7</text><text class="sub" x="89" y="148">May 9</text><rect class="box" x="118" y="118" width="50" height="36" rx="6"/><text class="bt" x="143" y="133">42</text><text class="sub" x="143" y="148">May 2</text><rect class="rec" x="172" y="118" width="50" height="36" rx="6"/><text class="rec-t" x="197" y="133">42</text><text class="rec-t" x="197" y="148">May 6</text><rect class="rec" x="226" y="118" width="50" height="36" rx="6"/><text class="rec-t" x="251" y="133">42</text><text class="rec-t" x="251" y="148">May 9</text><rect class="box" x="280" y="118" width="50" height="36" rx="6"/><text class="bt" x="305" y="133">58</text><text class="sub" x="305" y="148">May 8</text><text class="sub" x="170" y="172">✓ one short range, side by side</text></g>
  <g class="f" data-f="3"><text class="lb" x="170" y="200">B · any customer, since May 6</text><rect class="box" x="10" y="210" width="50" height="36" rx="6"/><text class="bt" x="35" y="225">7</text><text class="sub" x="35" y="240">May 1</text><rect class="note" x="64" y="210" width="50" height="36" rx="6"/><text class="note-t" x="89" y="225">7</text><text class="note-t" x="89" y="240">May 9</text><rect class="box" x="118" y="210" width="50" height="36" rx="6"/><text class="bt" x="143" y="225">42</text><text class="sub" x="143" y="240">May 2</text><rect class="note" x="172" y="210" width="50" height="36" rx="6"/><text class="note-t" x="197" y="225">42</text><text class="note-t" x="197" y="240">May 6</text><rect class="note" x="226" y="210" width="50" height="36" rx="6"/><text class="note-t" x="251" y="225">42</text><text class="note-t" x="251" y="240">May 9</text><rect class="note" x="280" y="210" width="50" height="36" rx="6"/><text class="note-t" x="305" y="225">58</text><text class="note-t" x="305" y="240">May 8</text><text class="sub badt" x="170" y="264">✗ matches are spread out</text><text class="sub" x="170" y="280">no single range: often a full table scan</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="308">A also needs status and total</text><rect class="rec" x="172" y="318" width="50" height="36" rx="6"/><text class="rec-t" x="197" y="333">42</text><text class="rec-t" x="197" y="348">May 6</text><rect class="rec" x="226" y="318" width="50" height="36" rx="6"/><text class="rec-t" x="251" y="333">42</text><text class="rec-t" x="251" y="348">May 9</text><line class="ln" x1="197" y1="356" x2="130" y2="378"/><line class="ln" x1="251" y1="356" x2="130" y2="378"/><rect class="box" x="20" y="380" width="120" height="30" rx="6"/><text class="bt" x="80" y="400">table (heap)</text><text class="sub" x="250" y="392">Index Scan:</text><text class="sub" x="250" y="408">one table visit per row</text></g>
  <g class="f" data-f="5"><rect class="okb" x="40" y="422" width="260" height="44" rx="8"/><text class="ok-t" x="170" y="440">+ INCLUDE (status, total)</text><text class="ok-t" x="170" y="458">→ Index Only Scan</text></g>
captions:
  - "The index keeps one entry per row, sorted by customer_id first. Inside one customer, entries are sorted by created_at. Each entry also points to its row in the table."
  - "Query A gives an exact customer and a start date. All its matches sit next to each other. The database jumps to the first one and reads until the range ends."
  - "Query B gives only a date. The dates are sorted only inside each customer, so the matches are spread across the whole index. The database usually reads the whole table instead."
  - "Query A also wants status and total. Those columns are not in the index. So for each match, Postgres must visit the table, called the heap, to read the row."
  - "Add the two columns with INCLUDE. Now the index holds everything A needs. Postgres can answer from the index alone, if the table pages are marked all-visible."
