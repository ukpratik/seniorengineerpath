id: cqrs-projection-version
title: "A command writes, a projection catches up, and the UI waits for the version it needs"
viewBox: 0 0 340 420
svg: |
  <rect class="box" x="6" y="10" width="96" height="36" rx="8"/><text class="bt" x="54" y="33">UI</text>
  <rect class="box" x="122" y="10" width="96" height="36" rx="8"/><text class="bt" x="170" y="33">Write side</text>
  <rect class="box" x="238" y="10" width="96" height="36" rx="8"/><text class="bt" x="286" y="33">Read model</text>
  <line class="life" x1="54" y1="46" x2="54" y2="410"/>
  <line class="life" x1="170" y1="46" x2="170" y2="410"/>
  <line class="life" x1="286" y1="46" x2="286" y2="410"/>
  <g class="f" data-f="1"><line class="ln" x1="56" y1="70" x2="166" y2="70"/><text class="lb" x="112" y="64">ShipOrder #42</text><rect class="rec" x="122" y="80" width="96" height="40" rx="8"/><text class="rec-t" x="170" y="97">#42 v5</text><text class="rec-t" x="170" y="113">Shipped</text><line class="ln" x1="166" y1="134" x2="58" y2="134"/><text class="lb" x="112" y="150">ok, version 5</text></g>
  <g class="f" data-f="2"><rect class="note" x="238" y="80" width="96" height="40" rx="8"/><text class="note-t" x="286" y="97">#42 v4</text><text class="note-t" x="286" y="113">Paid</text><line class="ln" x1="56" y1="172" x2="282" y2="172"/><text class="lb" x="170" y="166">GET #42, need v ≥ 5</text><text class="sub" x="170" y="192">Read model is at v4. Wait.</text></g>
  <g class="f" data-f="3"><line class="ln" x1="174" y1="214" x2="282" y2="214"/><text class="lb" x="228" y="208">event v5</text><rect class="okb" x="238" y="224" width="96" height="40" rx="8"/><text class="ok-t" x="286" y="241">#42 v5</text><text class="ok-t" x="286" y="257">Shipped</text><line class="ln" x1="282" y1="280" x2="58" y2="280"/><text class="lb" x="170" y="296">Shipped, v5</text></g>
  <g class="f" data-f="4"><line class="ln" x1="174" y1="322" x2="282" y2="322"/><text class="lb" x="228" y="316">v5 again</text><text class="xm" x="306" y="327">✕</text><text class="sub" x="228" y="344">5 ≤ 5: already applied, skip</text></g>
  <g class="f" data-f="5"><rect class="note" x="6" y="362" width="328" height="44" rx="8"/><text class="note-t" x="170" y="380">Lag too long? After 2 s, show</text><text class="note-t" x="170" y="397">"Shipped, updating…" from the command reply</text></g>
captions:
  - "The UI sends the ShipOrder command. The write side checks the rules, saves event version 5 for order #42, and replies with that version."
  - "The UI asks the read model for order #42 and passes the version it needs. The projection has only applied version 4, so the answer would be stale."
  - "The projection applies event 5 and stores version 5 on the row. The read model now meets the request, so it answers with the new state."
  - "Delivery is at least once, so event 5 arrives again. The row already holds version 5. The handler skips it, and nothing changes."
  - "If the read model does not catch up within a short timeout, do not hang. Show the state the command returned, marked as still updating."
