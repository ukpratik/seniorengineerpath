id: data-models-rename
title: "One user renames: embedded copies need 3 writes, a link table needs 1"
viewBox: 0 0 340 400
svg: |
  <text class="lb" x="170" y="16">A · Document: attendees inside each event</text>
  <line class="life" x1="5" y1="166" x2="335" y2="166"/>
  <text class="lb" x="170" y="186">B · Relational: a tickets table links them</text>
  <g class="f" data-f="1"><rect class="box" x="10" y="28" width="100" height="72" rx="8"/><text class="bt" x="60" y="45">Event 10</text><rect class="rec" x="20" y="54" width="80" height="18" rx="5"/><text class="rec-t" x="60" y="67">Asha</text><text class="sub" x="60" y="90">Ravi</text><rect class="box" x="120" y="28" width="100" height="72" rx="8"/><text class="bt" x="170" y="45">Event 11</text><rect class="rec" x="130" y="54" width="80" height="18" rx="5"/><text class="rec-t" x="170" y="67">Asha</text><text class="sub" x="170" y="90">Mei</text><rect class="box" x="230" y="28" width="100" height="72" rx="8"/><text class="bt" x="280" y="45">Event 12</text><rect class="rec" x="240" y="54" width="80" height="18" rx="5"/><text class="rec-t" x="280" y="67">Asha</text><text class="sub" x="280" y="90">Omar</text><text class="sub" x="170" y="120">event page = 1 read, no join</text></g>
  <g class="f" data-f="2"><rect class="note" x="20" y="54" width="80" height="18" rx="5"/><text class="note-t" x="60" y="67">Asha K.</text><rect class="note" x="130" y="54" width="80" height="18" rx="5"/><text class="note-t" x="170" y="67">Asha K.</text><rect class="note" x="240" y="54" width="80" height="18" rx="5"/><text class="note-t" x="280" y="67">Asha K.</text><text class="sub badt" x="170" y="146">rename = 3 writes, one per copy</text></g>
  <g class="f" data-f="3"><rect class="box" x="10" y="198" width="90" height="62" rx="8"/><text class="bt" x="55" y="214">users</text><text class="sub" x="55" y="234">1 Asha</text><text class="sub" x="55" y="252">2 Ravi</text><line class="ln" x1="100" y1="230" x2="122" y2="230"/><rect class="box" x="125" y="198" width="90" height="96" rx="8"/><text class="bt" x="170" y="214">tickets</text><text class="sub" x="170" y="234">user 1 → 10</text><text class="sub" x="170" y="250">user 1 → 11</text><text class="sub" x="170" y="266">user 1 → 12</text><text class="sub" x="170" y="282">user 2 → 10</text><line class="ln" x1="215" y1="230" x2="237" y2="230"/><rect class="box" x="240" y="198" width="90" height="80" rx="8"/><text class="bt" x="285" y="214">events</text><text class="sub" x="285" y="234">10 Expo</text><text class="sub" x="285" y="250">11 Meetup</text><text class="sub" x="285" y="266">12 Gig</text><text class="sub" x="170" y="314">each name is stored once</text></g>
  <g class="f" data-f="4"><rect class="okb" x="14" y="222" width="82" height="18" rx="5"/><text class="ok-t" x="55" y="235">1 Asha K.</text><rect class="okb" x="90" y="326" width="160" height="28" rx="8"/><text class="ok-t" x="170" y="345">✓ rename = 1 write</text><text class="sub" x="170" y="378">reads now join 3 tables</text></g>
captions:
  - "A stores a copy of each attendee's name inside every event. One read shows the whole event page. Asha has tickets for 3 events, so her name is stored 3 times."
  - "Asha changes her name. A must find and update all 3 copies. If one write fails, the events now disagree about her name."
  - "B keeps users and events in their own tables. A tickets table holds pairs of ids. This is how a relational model stores a many-to-many link. Some rows are not shown."
  - "In B the rename touches one row. The price moves to reads: to show an event page, B must join users, tickets and events."
