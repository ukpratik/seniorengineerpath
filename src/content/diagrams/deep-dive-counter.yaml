id: deep-dive-counter
title: "One deep dive on a viral like counter: numbers, options, compare, pick, watch"
viewBox: 0 0 340 455
svg: |
  <text class="lb" x="170" y="16">Deep dive: likes on one viral post</text>
  <g class="f" data-f="1"><rect class="box" x="10" y="28" width="150" height="44" rx="8"/><text class="bt" x="85" y="47">20,000 likes/s</text><text class="sub" x="85" y="63">our peak guess</text><rect class="box" x="180" y="28" width="150" height="44" rx="8"/><text class="bt" x="255" y="47">1,000 writes/s</text><text class="sub" x="255" y="63">limit per partition</text><text class="sub badt" x="170" y="92">One counter row is 20× too slow</text></g>
  <g class="f" data-f="2"><text class="lb" x="170" y="118">Options</text><rect class="rec" x="10" y="126" width="320" height="26" rx="6"/><text class="rec-t" x="170" y="143">A · one counter row (what we have)</text><rect class="rec" x="10" y="158" width="320" height="26" rx="6"/><text class="rec-t" x="170" y="175">B · 50 shard rows, add them up on read</text><rect class="rec" x="10" y="190" width="320" height="26" rx="6"/><text class="rec-t" x="170" y="207">C · sum in the app, write once a second</text></g>
  <g class="f" data-f="3"><text class="lb" x="170" y="242">Compare on our needs</text><text class="lb" x="220" y="262">A</text><text class="lb" x="265" y="262">B</text><text class="lb" x="310" y="262">C</text><text x="12" y="284">20,000 likes/s</text><text class="sub badt" x="220" y="284">✗</text><text class="ok-t" x="265" y="284">✓</text><text class="ok-t" x="310" y="284">✓</text><text x="12" y="306">count may lag ≤ 5 s</text><text class="ok-t" x="220" y="306">✓</text><text class="ok-t" x="265" y="306">✓</text><text class="ok-t" x="310" y="306">✓</text><text x="12" y="328">no saved like lost</text><text class="ok-t" x="220" y="328">✓</text><text class="ok-t" x="265" y="328">✓</text><text class="sub badt" x="310" y="328">✗</text></g>
  <g class="f" data-f="4"><rect class="okb" x="10" y="340" width="320" height="44" rx="8"/><text class="ok-t" x="170" y="358">Pick B: 20,000 ÷ 50 = 400 writes/s per key</text><text class="sub" x="170" y="375">pages read one total, refreshed each second</text></g>
  <g class="f" data-f="5"><rect class="note" x="10" y="396" width="320" height="50" rx="8"/><text class="note-t" x="170" y="416">Watch: throttled writes, total delay</text><text class="note-t" x="170" y="436">Change if: counts must be exact</text></g>
captions:
  - "State the problem with a number. The counter lives in DynamoDB. We guess a viral post peaks at 20,000 likes per second. One partition takes at most 1,000 writes per second. One row cannot keep up."
  - "Give two or three options. Keep one row, split the count across 50 rows, or add likes up in each app server and write once a second."
  - "Compare on the needs you agreed. A is too slow. C can lose the last second or so of likes if a server crashes. Only B meets all three."
  - "Pick, and say the cost. 50 shards cut each key to about 400 writes per second, well under the limit. The cost is reading 50 rows, so a small job sums them each second and pages read that one total."
  - "Say what you would watch and what would change your mind. Track throttled writes and how stale the total gets. If counts had to be exact, you would choose again."
