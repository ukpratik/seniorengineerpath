id: false-sharing-padding
title: "Two threads write their own counters, but the counters share one cache line"
viewBox: 0 0 340 430
svg: |
  <line class="life" x1="85" y1="54" x2="85" y2="300"/><line class="life" x1="255" y1="54" x2="255" y2="300"/>
  <rect class="box" x="10" y="10" width="150" height="44" rx="10"/><text class="bt" x="85" y="30">Core 1</text><text class="sub" x="85" y="46">thread T1 adds to A</text>
  <rect class="box" x="180" y="10" width="150" height="44" rx="10"/><text class="bt" x="255" y="30">Core 2</text><text class="sub" x="255" y="46">thread T2 adds to B</text>
  <g class="f" data-f="1"><rect class="rec" x="20" y="66" width="130" height="26" rx="6"/><text class="rec-t" x="85" y="83">A | B | …</text><rect class="rec" x="190" y="66" width="130" height="26" rx="6"/><text class="rec-t" x="255" y="83">A | B | …</text><text class="sub" x="170" y="112">one 64-byte line holds A and B</text></g>
  <g class="f" data-f="2"><rect class="rec" x="20" y="126" width="130" height="26" rx="6"/><text class="rec-t" x="85" y="143">A+1 | B | …</text><rect class="lost" x="190" y="126" width="130" height="26" rx="6"/><text class="lb" x="255" y="143">invalid</text><line class="ln" x1="152" y1="139" x2="186" y2="139"/><text class="sub" x="170" y="172">T1 writes A · core 2 loses the line</text></g>
  <g class="f" data-f="3"><rect class="lost" x="20" y="186" width="130" height="26" rx="6"/><text class="lb" x="85" y="203">invalid</text><rect class="rec" x="190" y="186" width="130" height="26" rx="6"/><text class="rec-t" x="255" y="203">A+1 | B+1 | …</text><line class="ln" x1="186" y1="199" x2="154" y2="199"/><text class="sub badt" x="170" y="232">the line moves on every write</text></g>
  <g class="f" data-f="4"><rect class="rec" x="20" y="250" width="130" height="26" rx="6"/><text class="rec-t" x="85" y="267">A | padding</text><rect class="rec" x="190" y="250" width="130" height="26" rx="6"/><text class="rec-t" x="255" y="267">B | padding</text><text class="sub" x="170" y="296">A and B now on different lines</text><rect class="okb" x="20" y="316" width="300" height="30" rx="8"/><text class="ok-t" x="170" y="336">✓ each core keeps its own line</text></g>
captions:
  - "Thread T1 adds to counter A. Thread T2 adds to counter B. They never touch each other's counter. But A and B sit next to each other, so they are in the same 64-byte cache line. Each core has a copy of that line."
  - "T1 writes A. Before a core writes a line, it must own it. So the other core's copy of the whole line is marked invalid. Core 2 did nothing wrong, but it lost B too."
  - "Now T2 writes B. Core 2 must get the line back, and core 1's copy becomes invalid. This repeats on every write. The cores spend their time moving one line back and forth. This is false sharing."
  - "The fix is padding: put at least one cache line of unused bytes after A, so B starts on a new line. The JDK pads by 128 bytes. Now each core owns its own line and keeps it. No line moves between the cores."
