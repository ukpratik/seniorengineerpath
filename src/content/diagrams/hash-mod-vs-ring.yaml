id: hash-mod-vs-ring
title: "Add one server: hash mod N moves most keys, a hash ring moves one arc"
viewBox: 0 0 340 500
svg: |
  <text class="lb" x="170" y="18">A · hash(key) mod N</text>
  <text class="sub" x="40" y="42">key</text><text class="sub" x="110" y="42">hash</text><text class="sub" x="195" y="42">3 servers</text><text class="sub" x="285" y="42">4 servers</text>
  <text class="bt" x="40" y="66">A</text><text class="sub" x="110" y="66">12</text>
  <text class="bt" x="40" y="90">B</text><text class="sub" x="110" y="90">7</text>
  <text class="bt" x="40" y="114">C</text><text class="sub" x="110" y="114">22</text>
  <text class="bt" x="40" y="138">D</text><text class="sub" x="110" y="138">17</text>
  <text class="bt" x="40" y="162">E</text><text class="sub" x="110" y="162">25</text>
  <text class="bt" x="40" y="186">F</text><text class="sub" x="110" y="186">30</text>
  <g class="f" data-f="1"><text class="sub" x="195" y="66">S0</text><text class="sub" x="195" y="90">S1</text><text class="sub" x="195" y="114">S1</text><text class="sub" x="195" y="138">S2</text><text class="sub" x="195" y="162">S1</text><text class="sub" x="195" y="186">S0</text></g>
  <g class="f" data-f="2"><text class="sub" x="285" y="66">S0</text><text class="sub badt" x="285" y="90">S3 · moved</text><text class="sub badt" x="285" y="114">S2 · moved</text><text class="sub badt" x="285" y="138">S1 · moved</text><text class="sub" x="285" y="162">S1</text><text class="sub badt" x="285" y="186">S2 · moved</text></g>
  <g class="f" data-f="3"><rect class="note" x="80" y="198" width="180" height="26" rx="7"/><text class="note-t" x="170" y="215">4 of 6 keys moved</text></g>
  <g class="f" data-f="4"><line class="life" x1="8" y1="236" x2="332" y2="236"/><text class="lb" x="170" y="256">B · hash ring</text>
  <circle class="life" cx="170" cy="360" r="85" fill="none"/>
  <rect class="box" x="202" y="280" width="36" height="22" rx="6"/><text class="bt" x="220" y="296">S0</text>
  <rect class="box" x="193" y="423" width="36" height="22" rx="6"/><text class="bt" x="211" y="439">S1</text>
  <rect class="box" x="67" y="349" width="36" height="22" rx="6"/><text class="bt" x="85" y="365">S2</text>
  <circle class="rec" cx="170" cy="275" r="10"/><text class="rec-t" x="170" y="280">A</text>
  <circle class="rec" cx="251" cy="334" r="10"/><text class="rec-t" x="251" y="339">B</text>
  <circle class="rec" cx="251" cy="386" r="10"/><text class="rec-t" x="251" y="391">C</text>
  <circle class="rec" cx="170" cy="445" r="10"/><text class="rec-t" x="170" y="450">D</text>
  <circle class="rec" cx="120" cy="429" r="10"/><text class="rec-t" x="120" y="434">E</text>
  <circle class="rec" cx="101" cy="310" r="10"/><text class="rec-t" x="101" y="315">F</text>
  <text class="sub" x="170" y="355">each key goes to</text><text class="sub" x="170" y="371">the next server ↻</text></g>
  <g class="f" data-f="5"><rect class="note" x="237" y="349" width="36" height="22" rx="6"/><text class="note-t" x="255" y="365">S3</text><text class="sub badt" x="306" y="330">B moves</text><text class="sub" x="306" y="390">C stays</text></g>
  <g class="f" data-f="6"><rect class="okb" x="40" y="462" width="260" height="30" rx="8"/><text class="ok-t" x="170" y="482">✓ only 1 of 6 keys moved</text></g>
captions:
  - "Method A: pick the server with hash(key) mod N. With 3 servers, key A has hash 12, and 12 mod 3 = 0, so it goes to S0."
  - "You add a fourth server, so N becomes 4. Key B has hash 7, and 7 mod 4 = 3, so it moves from S1 to S3. B, C, D and F all change servers."
  - "4 of 6 keys moved, and some moved between two old servers. On average, going from 3 to 4 servers moves 3 of every 4 keys."
  - "Method B: a hash ring. Servers and keys are hashed to points on a circle. Each key belongs to the next server clockwise. So B and C belong to S1."
  - "You add S3. It lands between S0 and S1, so it takes only the keys in that arc: just B. C is past S3, so it stays on S1."
  - "Only B moved. With N servers, a new server takes about 1/(N+1) of the keys, and no key moves between two old servers."
