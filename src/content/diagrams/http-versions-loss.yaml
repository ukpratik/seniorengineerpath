id: http-versions-loss
title: "Three requests, one lost packet: HTTP/1.1, HTTP/2 and HTTP/3"
viewBox: 0 0 340 400
svg: |
  <text class="lb" x="170" y="20">HTTP/1.1 · three TCP connections</text>
  <text class="lb" x="170" y="170">HTTP/2 · one TCP connection</text>
  <text class="lb" x="170" y="290">HTTP/3 · one QUIC connection</text>
  <g class="f" data-f="1"><line class="life" x1="14" y1="47" x2="226" y2="47"/><line class="life" x1="14" y1="77" x2="226" y2="77"/><line class="life" x1="14" y1="107" x2="226" y2="107"/><rect class="rec" x="40" y="36" width="44" height="22" rx="6"/><text class="rec-t" x="62" y="51">A1</text><rect class="rec" x="96" y="36" width="44" height="22" rx="6"/><text class="rec-t" x="118" y="51">A2</text><rect class="rec" x="40" y="66" width="44" height="22" rx="6"/><text class="rec-t" x="62" y="81">B1</text><rect class="rec" x="96" y="66" width="44" height="22" rx="6"/><text class="rec-t" x="118" y="81">B2</text><rect class="rec" x="40" y="96" width="44" height="22" rx="6"/><text class="rec-t" x="62" y="111">C1</text><rect class="rec" x="96" y="96" width="44" height="22" rx="6"/><text class="rec-t" x="118" y="111">C2</text><text class="sub" x="170" y="140">3 handshakes · one request each</text></g>
  <g class="f" data-f="2"><path class="xm" d="M55 70l14 14M69 70l-14 14"/><rect class="okb" x="234" y="36" width="96" height="22" rx="6"/><text class="ok-t" x="282" y="51">✓ A done</text><rect class="note" x="234" y="66" width="96" height="22" rx="6"/><text class="note-t" x="282" y="81">B waits</text><rect class="okb" x="234" y="96" width="96" height="22" rx="6"/><text class="ok-t" x="282" y="111">✓ C done</text></g>
  <g class="f" data-f="3"><line class="life" x1="10" y1="196" x2="330" y2="196"/><rect class="rec" x="14" y="185" width="52" height="22" rx="6"/><text class="rec-t" x="40" y="200">A1</text><rect class="rec" x="78" y="185" width="52" height="22" rx="6"/><text class="rec-t" x="104" y="200">B1</text><rect class="rec" x="142" y="185" width="52" height="22" rx="6"/><text class="rec-t" x="168" y="200">C1</text><rect class="rec" x="206" y="185" width="52" height="22" rx="6"/><text class="rec-t" x="232" y="200">A2</text><rect class="rec" x="270" y="185" width="52" height="22" rx="6"/><text class="rec-t" x="296" y="200">C2</text><text class="sub" x="170" y="228">streams A, B, C share one byte order</text></g>
  <g class="f" data-f="4"><path class="xm" d="M97 189l14 14M111 189l-14 14"/><rect class="note" x="70" y="240" width="200" height="24" rx="7"/><text class="note-t" x="170" y="256">A, B and C all wait for B1</text></g>
  <g class="f" data-f="5"><line class="life" x1="10" y1="316" x2="330" y2="316"/><rect class="rec" x="14" y="305" width="52" height="22" rx="6"/><text class="rec-t" x="40" y="320">A1</text><rect class="rec" x="78" y="305" width="52" height="22" rx="6"/><text class="rec-t" x="104" y="320">B1</text><rect class="rec" x="142" y="305" width="52" height="22" rx="6"/><text class="rec-t" x="168" y="320">C1</text><rect class="rec" x="206" y="305" width="52" height="22" rx="6"/><text class="rec-t" x="232" y="320">A2</text><rect class="rec" x="270" y="305" width="52" height="22" rx="6"/><text class="rec-t" x="296" y="320">C2</text><text class="sub" x="170" y="348">each stream keeps its own order</text></g>
  <g class="f" data-f="6"><path class="xm" d="M97 309l14 14M111 309l-14 14"/><rect class="okb" x="30" y="360" width="134" height="24" rx="7"/><text class="ok-t" x="97" y="376">✓ A and C done</text><rect class="note" x="176" y="360" width="134" height="24" rx="7"/><text class="note-t" x="243" y="376">only B waits</text></g>
captions:
  - "HTTP/1.1: a connection carries one request at a time, so the browser opens three TCP connections for requests A, B and C. That costs three handshakes."
  - "Packet B1 is lost. Only connection B waits for TCP to send it again. A and C finish, because they use other connections."
  - "HTTP/2: all three requests share one TCP connection. Each request is a stream, and their frames are mixed into one ordered byte stream."
  - "Packet B1 is lost. TCP cannot see streams, so it holds C1, A2 and C2 until B1 arrives again. All three requests wait. This is head-of-line blocking."
  - "HTTP/3: the three requests use one QUIC connection over UDP. QUIC knows about streams, and keeps each stream in order on its own."
  - "Packet B1 is lost. QUIC still hands A and C to the app. Only stream B waits for B1 to be sent again."
