captions:
  - The app sends the payment with a new idempotency key, 7f3a. It made the key once, when Priya tapped Pay.
  - The server saves the key, then charges the card ₹1,499. It stores the result next to the key.
  - The server's answer is lost on the network. After 10 seconds the app stops waiting. It does not know that the charge worked.
  - The app retries. It sends the same request with the same key, 7f3a, not a new one.
  - The server finds 7f3a in its saved keys. It sends back the saved result and does not charge again. Priya pays once.
