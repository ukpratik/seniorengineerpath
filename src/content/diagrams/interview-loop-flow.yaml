captions:
  - "A recruiter calls first. This is where you confirm the role, the level you are being considered for and the timeline. Ask your questions here."
  - "A technical phone screen follows. It is usually one or two coding problems with an engineer, solved while you explain your thinking."
  - "The loop is a set of separate interviews on one day or a few days. Each interviewer covers a different area, such as coding, design or behaviour."
  - "After each interview, the interviewer writes structured feedback on their own. At some companies they cannot see the others' notes first."
  - "A group, or a hiring manager with a neutral reviewer, reads all the feedback together. They decide two things: hire or not, and at which level."
