id: kafka-isr-min-insync
title: "How the ISR, acks=all and min.insync.replicas decide what is safe"
viewBox: 0 0 340 404
svg: |
  <text class="lb" x="170" y="15">1 partition · 3 replicas · min.insync.replicas=2</text>
  <rect class="box" x="10" y="24" width="100" height="32" rx="8"/><text class="bt" x="60" y="45">B1 leader</text>
  <rect class="box" x="120" y="24" width="100" height="32" rx="8"/><text class="bt" x="170" y="45">B2</text>
  <rect class="box" x="230" y="24" width="100" height="32" rx="8"/><text class="bt" x="280" y="45">B3</text>
  <g class="f" data-f="1"><rect class="rec" x="20" y="68" width="80" height="20" rx="5"/><text class="rec-t" x="60" y="82">0–5 (5 new)</text><rect class="rec" x="130" y="68" width="80" height="20" rx="5"/><text class="rec-t" x="170" y="82">0–4</text><rect class="rec" x="240" y="68" width="80" height="20" rx="5"/><text class="rec-t" x="280" y="82">0–4</text><text class="sub" x="170" y="106">ISR = B1, B2, B3</text><text class="sub" x="170" y="122">Consumers can read up to 4</text></g>
  <g class="f" data-f="2"><rect class="rec" x="20" y="134" width="80" height="20" rx="5"/><text class="rec-t" x="60" y="148">0–5</text><rect class="rec" x="130" y="134" width="80" height="20" rx="5"/><text class="rec-t" x="170" y="148">0–5</text><rect class="rec" x="240" y="134" width="80" height="20" rx="5"/><text class="rec-t" x="280" y="148">0–5</text><rect class="okb" x="40" y="160" width="260" height="26" rx="8"/><text class="ok-t" x="170" y="178">✓ all ISR have 5: ack, readable</text></g>
  <g class="f" data-f="3"><rect class="rec" x="20" y="200" width="80" height="20" rx="5"/><text class="rec-t" x="60" y="214">0–6</text><rect class="rec" x="130" y="200" width="80" height="20" rx="5"/><text class="rec-t" x="170" y="214">0–6</text><rect class="rec lost" x="240" y="200" width="80" height="20" rx="5"/><text class="rec-t" x="280" y="214">0–5</text><text class="sub" x="170" y="238">B3 is too far behind: out of the ISR</text><text class="sub" x="170" y="254">ISR = B1, B2. 2 ≥ 2, so 6 is acked</text></g>
  <g class="f" data-f="4"><rect class="rec" x="20" y="266" width="80" height="20" rx="5"/><text class="rec-t" x="60" y="280">0–6</text><line class="xm" x1="150" y1="266" x2="190" y2="286"/><line class="xm" x1="190" y1="266" x2="150" y2="286"/><rect class="rec lost" x="240" y="266" width="80" height="20" rx="5"/><text class="rec-t" x="280" y="280">0–5</text><text class="sub badt" x="170" y="304">ISR = B1 only. 1 &lt; 2</text><text class="sub badt" x="170" y="320">Write 7 fails: NotEnoughReplicas</text></g>
  <g class="f" data-f="5"><line class="xm" x1="40" y1="332" x2="80" y2="352"/><line class="xm" x1="80" y1="332" x2="40" y2="352"/><line class="xm" x1="150" y1="332" x2="190" y2="352"/><line class="xm" x1="190" y1="332" x2="150" y2="352"/><rect class="rec lost" x="240" y="332" width="80" height="20" rx="5"/><text class="rec-t" x="280" y="346">0–5</text><rect class="note" x="30" y="362" width="280" height="38" rx="8"/><text class="note-t" x="170" y="378">B3 lacks 6. Unclean election is off,</text><text class="note-t" x="170" y="394">so the partition waits for B1</text></g>
captions:
  - "A producer with acks=all sends offset 5. The leader, B1, appends it. B2 and B3 have not fetched it yet, so consumers can still read only up to offset 4."
  - "B2 and B3 fetch offset 5. Now every in-sync replica has it. The leader acks the producer, and the high watermark moves, so consumers can read offset 5."
  - "B3 falls too far behind and leaves the ISR. Two replicas are still in sync, which meets min.insync.replicas=2. Offset 6 is acked with two copies."
  - "B2 crashes. Only the leader is in sync. With acks=all, the write fails with NotEnoughReplicas. The producer sees an error, not a false ack."
  - "B1 crashes too. Only B3 is left, and it is missing offset 6. With unclean election off (the default), Kafka keeps the partition offline until B1 returns (or, with eligible leader replicas on, an ELR member can lead). It does not lose offset 6."
