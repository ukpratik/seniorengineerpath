id: ladder-gap
title: "Map your evidence to each ladder dimension to find the gap"
viewBox: 0 0 340 400
svg: |
  <text class="lb" x="170" y="18">Next level on your ladder: senior</text>
  <rect class="box" x="6" y="32" width="104" height="40" rx="8"/><text class="bt" x="58" y="57">Tech skill</text>
  <rect class="box" x="6" y="82" width="104" height="40" rx="8"/><text class="bt" x="58" y="107">Delivery</text>
  <rect class="box" x="6" y="132" width="104" height="40" rx="8"/><text class="bt" x="58" y="157">Scope</text>
  <rect class="box" x="6" y="182" width="104" height="40" rx="8"/><text class="bt" x="58" y="207">Influence</text>
  <rect class="box" x="6" y="232" width="104" height="40" rx="8"/><text class="bt" x="58" y="257">People</text>
  <g class="f" data-f="1"><text class="sub" x="224" y="48">good design trade-offs</text><text class="sub" x="224" y="98">ships on time, high quality</text><text class="sub" x="224" y="148">owns an unclear project</text><text class="sub" x="224" y="198">leads work across teams</text><text class="sub" x="224" y="248">helps others grow</text></g>
  <g class="f" data-f="2"><text class="ok-t" x="224" y="66">✓ retry design doc</text><text class="ok-t" x="224" y="116">✓ 14 features, few bugs</text></g>
  <g class="f" data-f="3"><text class="sub badt" x="224" y="166">? only clear tickets</text><text class="sub badt" x="224" y="216">✗ no cross-team work</text><text class="sub badt" x="224" y="266">✗ no mentoring yet</text></g>
  <g class="f" data-f="4"><rect class="rec" x="20" y="290" width="300" height="46" rx="8"/><text class="rec-t" x="170" y="309">With your manager: pick 1–2 gaps</text><text class="rec-t" x="170" y="327">lead the search project + 1 mentee</text></g>
  <g class="f" data-f="5"><rect class="okb" x="20" y="348" width="300" height="44" rx="8"/><text class="ok-t" x="170" y="367">✓ 2 quarters of evidence</text><text class="ok-t" x="170" y="384">→ written into the promotion case</text></g>
captions:
  - "Start with your company's ladder. Read the next level, not your own. Each dimension says what that level looks like. These five are a simplified example."
  - "Now add your evidence: real work with links. Here the engineer is strong in technical skill and delivery. Those were the skills that got them to mid-level."
  - "Three rows have no evidence. They only took clear tickets, never led work across teams, and never mentored anyone. This is the gap."
  - "Do not try to fix every gap at once. Agree on one or two with your manager, and on the work that will show them."
  - "After a few months, you have evidence in every row. Your manager uses it to write the promotion case. Ladders and processes differ by company."
