id: last-item-race
title: "Two buyers race for the last item, then one atomic UPDATE fixes it"
viewBox: 0 0 340 470
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="330"/><line class="life" x1="170" y1="54" x2="170" y2="330"/><line class="life" x1="285" y1="54" x2="285" y2="330"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Buyer A</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">stock row</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Buyer B</text>
  <rect class="rec" x="125" y="62" width="90" height="24" rx="7"/><text class="rec-t" x="170" y="78">stock = 1</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="108" x2="166" y2="108"/><text class="lb" x="112" y="99">read stock</text><line class="ln" x1="168" y1="134" x2="59" y2="134"/><text class="lb" x="112" y="127">1</text></g>
  <g class="f" data-f="2"><line class="ln" x1="283" y1="160" x2="174" y2="160"/><text class="lb" x="227" y="151">read stock</text><line class="ln" x1="172" y1="186" x2="281" y2="186"/><text class="lb" x="227" y="179">1</text></g>
  <g class="f" data-f="3"><line class="ln" x1="57" y1="222" x2="166" y2="222"/><text class="lb" x="112" y="213">write 0</text><rect class="rec" x="125" y="232" width="90" height="24" rx="7"/><text class="rec-t" x="170" y="248">stock = 0</text><text class="sub" x="55" y="248">order A</text></g>
  <g class="f" data-f="4"><line class="ln" x1="283" y1="276" x2="174" y2="276"/><text class="lb" x="227" y="267">write 0</text><text class="sub" x="285" y="300">order B</text><path class="xm" d="M163 290l14 14M177 290l-14 14"/><text class="sub badt" x="170" y="324">2 orders, 1 item</text></g>
  <g class="f" data-f="5"><rect class="note" x="10" y="342" width="320" height="26" rx="7"/><text class="note-t" x="170" y="359">SET stock = stock − 1 WHERE stock &gt; 0</text><text class="sub" x="170" y="390">A: 1 row changed → order</text></g>
  <g class="f" data-f="6"><text class="sub badt" x="170" y="414">B: 0 rows changed → sold out</text><rect class="okb" x="40" y="428" width="260" height="30" rx="8"/><text class="ok-t" x="170" y="448">✓ one item, one order</text></g>
captions:
  - "One unit is left. Buyer A's request reads the stock row. It sees 1, so the code decides it can sell."
  - "At the same moment, Buyer B's request reads the same row. It also sees 1. Neither request knows about the other."
  - "Request A works out 1 − 1 = 0 in the app, writes 0 and creates order A. So far, so good."
  - "Request B also writes 0 and creates order B. Stock says 0, but two people paid for one item. One of them gets an apology email."
  - "The fix: let the database check and change the row in one statement. Request A's UPDATE matches the row, since stock is 1. It changes 1 row, so A gets the item."
  - "Request B's UPDATE waits until A's transaction commits. Then Postgres checks WHERE stock > 0 again on the new value, 0. It changes 0 rows, so the app shows sold out."
