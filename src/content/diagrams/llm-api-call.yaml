id: llm-api-call
title: "One LLM API call: from prompt to checked output"
viewBox: 0 0 340 500
svg: |
  <rect class="box" x="5" y="10" width="330" height="44" rx="10"/><text class="bt" x="170" y="37">Your app calls the LLM API</text>
  <g class="f" data-f="1"><line class="ln" x1="170" y1="56" x2="170" y2="76"/><rect class="box" x="5" y="80" width="330" height="70" rx="10"/><text class="bt" x="170" y="100">Prompt</text><text class="sub" x="170" y="120">System: sort tickets. Reply as JSON.</text><text class="sub" x="170" y="140">User: “My card was charged twice”</text></g>
  <g class="f" data-f="2"><line class="ln" x1="170" y1="152" x2="170" y2="170"/><text class="lb" x="230" y="166">split into tokens</text><rect class="rec" x="10" y="174" width="44" height="26" rx="7"/><text class="rec-t" x="32" y="191">My</text><rect class="rec" x="58" y="174" width="44" height="26" rx="7"/><text class="rec-t" x="80" y="191">card</text><rect class="rec" x="106" y="174" width="44" height="26" rx="7"/><text class="rec-t" x="128" y="191">was</text><rect class="rec" x="154" y="174" width="60" height="26" rx="7"/><text class="rec-t" x="184" y="191">charged</text><rect class="rec" x="218" y="174" width="50" height="26" rx="7"/><text class="rec-t" x="243" y="191">twice</text><text class="sub" x="305" y="191">…</text><text class="sub" x="170" y="218">412 input tokens</text></g>
  <g class="f" data-f="3"><rect class="note" x="20" y="230" width="300" height="26" rx="7"/><text class="note-t" x="170" y="247">model reads all 412 tokens in its context window</text></g>
  <g class="f" data-f="4"><line class="ln" x1="170" y1="258" x2="170" y2="278"/><text class="lb" x="245" y="272">one token at a time</text><rect class="rec" x="10" y="282" width="34" height="26" rx="7"/><text class="rec-t" x="27" y="299">{"</text><rect class="rec" x="48" y="282" width="74" height="26" rx="7"/><text class="rec-t" x="85" y="299">category</text><rect class="rec" x="126" y="282" width="40" height="26" rx="7"/><text class="rec-t" x="146" y="299">":"</text><rect class="rec" x="170" y="282" width="70" height="26" rx="7"/><text class="rec-t" x="205" y="299">billing</text><rect class="rec" x="244" y="282" width="34" height="26" rx="7"/><text class="rec-t" x="261" y="299">"}</text><text class="sub" x="170" y="328">streamed to the app as they come</text><text class="sub" x="170" y="346">first token = time to first token</text></g>
  <g class="f" data-f="5"><rect class="note" x="20" y="358" width="300" height="26" rx="7"/><text class="note-t" x="170" y="375">stop: the model ended its turn</text></g>
  <g class="f" data-f="6"><line class="ln" x1="170" y1="386" x2="170" y2="406"/><text class="lb" x="240" y="400">your code checks</text><rect class="okb" x="20" y="410" width="300" height="34" rx="8"/><text class="ok-t" x="170" y="432">✓ valid JSON · “billing” is allowed</text><rect class="rec" x="20" y="452" width="300" height="34" rx="7"/><text class="rec-t" x="170" y="474">if not: retry once, then fall back</text></g>
captions:
  - Your app sends one request. It holds a system prompt with the rules, and the user's message. All the numbers in this example are made up.
  - The API splits the text into tokens, the units the model reads and you pay for. Here the request is 412 input tokens.
  - The model reads every token in its context window. It has no other memory of this user. What is not in the request, it does not know.
  - The model writes its answer one token at a time. Each new token depends on the tokens before it. With streaming, your app gets each token as soon as it is made.
  - The model stops when it ends its turn. It can also stop because it hit your max_tokens limit, and then the answer is cut off.
  - Your code parses the JSON and checks that the category is on the allowed list. If the check fails, retry once, then use a fallback such as a human queue.
