id: lost-update
title: "A lost update: two transactions read 10 and both write 9"
viewBox: 0 0 340 470
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="456"/><line class="life" x1="170" y1="54" x2="170" y2="456"/><line class="life" x1="285" y1="54" x2="285" y2="456"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Order A</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">stock row</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Order B</text>
  <rect class="rec" x="125" y="62" width="90" height="24" rx="7"/><text class="rec-t" x="170" y="78">stock = 10</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="108" x2="166" y2="108"/><text class="lb" x="112" y="99">read stock</text><line class="ln" x1="168" y1="135" x2="59" y2="135"/><text class="lb" x="112" y="128">10</text></g>
  <g class="f" data-f="2"><line class="ln" x1="283" y1="165" x2="174" y2="165"/><text class="lb" x="227" y="156">read stock</text><line class="ln" x1="172" y1="192" x2="281" y2="192"/><text class="lb" x="227" y="185">10</text></g>
  <g class="f" data-f="3"><line class="ln" x1="57" y1="230" x2="166" y2="230"/><text class="lb" x="112" y="221">write 9</text><text class="sub" x="112" y="247">commit</text><rect class="rec" x="125" y="256" width="90" height="24" rx="7"/><text class="rec-t" x="170" y="272">stock = 9</text></g>
  <g class="f" data-f="4"><line class="ln" x1="283" y1="305" x2="174" y2="305"/><text class="lb" x="227" y="296">write 9</text><text class="sub" x="227" y="322">commit</text><rect class="rec" x="125" y="330" width="90" height="24" rx="7"/><text class="rec-t" x="170" y="346">stock = 9</text><path class="xm" d="M222 335l14 14M236 335l-14 14"/><text class="sub badt" x="170" y="372">2 sold: stock should be 8</text></g>
  <g class="f" data-f="5"><rect class="okb" x="10" y="390" width="320" height="30" rx="8"/><text class="ok-t" x="170" y="410">✓ SET stock = stock - 1 → 8</text><rect class="okb" x="10" y="426" width="320" height="30" rx="8"/><text class="ok-t" x="170" y="446">✓ or SELECT … FOR UPDATE → B waits</text></g>
captions:
  - "Stock is 10. Order A starts a transaction and reads the stock row. It gets 10."
  - "At the same moment, Order B starts its own transaction and reads the same row. It also gets 10."
  - "Order A works out 10 − 1 = 9 in the app code. It writes 9 and commits."
  - "Order B also works out 9, writes it and commits. It overwrites A's write. Two items were sold, but stock says 9. One update is lost."
  - "Fixes: let the database do the math in one atomic UPDATE, or lock the row with SELECT … FOR UPDATE so B waits and then reads 9. In Postgres, Repeatable Read or Serializable would instead make B's write fail, and the app retries B."
