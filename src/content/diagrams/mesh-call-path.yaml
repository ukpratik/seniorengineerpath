id: mesh-call-path
title: "One call through a sidecar mesh: two proxies do the network work"
viewBox: 0 0 340 372
svg: |
  <rect class="box" x="110" y="6" width="120" height="34" rx="8"/><text class="bt" x="170" y="28">Control plane</text>
  <text class="sub" x="76" y="74">orders pod</text>
  <text class="sub" x="264" y="74">payments pod</text>
  <rect class="box" x="4" y="82" width="64" height="36" rx="8"/><text class="bt" x="36" y="105">Orders</text>
  <rect class="box" x="84" y="82" width="64" height="36" rx="8"/><text class="bt" x="116" y="105">Proxy</text>
  <rect class="box" x="192" y="82" width="64" height="36" rx="8"/><text class="bt" x="224" y="105">Proxy</text>
  <rect class="box" x="272" y="82" width="64" height="36" rx="8"/><text class="bt" x="304" y="105">Payments</text>
  <g class="f" data-f="1"><line class="ln" x1="68" y1="100" x2="80" y2="100"/><text class="lb" x="76" y="140">1</text><text class="sub" x="170" y="158">Orders makes a plain HTTP call.</text><text class="sub" x="170" y="174">Its own proxy catches it.</text></g>
  <g class="f" data-f="2"><line class="ln" x1="150" y1="100" x2="188" y2="100"/><text class="lb" x="170" y="90">mTLS</text><rect class="okb" x="60" y="184" width="220" height="26" rx="8"/><text class="ok-t" x="170" y="202">✓ caller is orders, callee is payments</text><line class="ln" x1="258" y1="100" x2="268" y2="100"/></g>
  <g class="f" data-f="3"><rect class="rec" x="40" y="222" width="260" height="26" rx="8"/><text class="rec-t" x="170" y="240">timeout 2 s · up to 2 retries</text><text class="sub" x="170" y="266">Set in mesh config, not in app code</text></g>
  <g class="f" data-f="4"><line class="ln" x1="116" y1="120" x2="150" y2="284"/><line class="ln" x1="224" y1="120" x2="190" y2="284"/><rect class="box" x="100" y="288" width="140" height="32" rx="8"/><text class="bt" x="170" y="309">Metrics, traces</text></g>
  <g class="f" data-f="5"><line class="ln" x1="150" y1="42" x2="122" y2="78"/><line class="ln" x1="190" y1="42" x2="218" y2="78"/><rect class="note" x="20" y="334" width="300" height="30" rx="8"/><text class="note-t" x="170" y="354">Stale routes if the updates stop</text></g>
captions:
  - "The orders service calls payments as if the network were simple. A proxy in the same pod catches the call. The app does not know it is there."
  - "The two proxies open a mutual TLS connection. Each one shows a certificate that names its workload. Then the payments proxy hands the request to the payments app."
  - "The client-side proxy applies the timeout and retry rules from the mesh config. You change them without a new build of the app."
  - "Both proxies report every request: count, errors, latency. They can also send trace spans. You get the same metrics for every service, in any language."
  - "The control plane sends each proxy its routes, the list of healthy endpoints, and signs its certificates. It is not on the request path. But if its updates stop, proxies keep routing on old data."
