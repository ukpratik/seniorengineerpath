captions:
  - "In a modular monolith, an order request reaches the Orders module. It calls Stock, Payments and Email as plain function calls, inside one process, with one database."
  - "All the writes go in one database transaction. If the payment fails, the stock change rolls back too. A stack trace shows the whole path."
  - "Now the same request with four services. Orders must call Stock, Payments and Email over the network. Each call adds a hop, and its own wait."
  - "Any hop can fail or time out. If the charge call times out, Orders does not know if the card was charged. It needs timeouts, retries and idempotency keys."
  - "Each service owns its database, so there is no single transaction. To undo the stock hold, you need a saga. To see the whole path, you need distributed tracing."
