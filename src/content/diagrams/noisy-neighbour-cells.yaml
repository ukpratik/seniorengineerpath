  <g class="f" data-f="3"><path class="xm" d="M100 158l12 12M112 158l-12 12"/><path class="xm" d="M164 158l12 12M176 158l-12 12"/><path class="xm" d="M228 158l12 12M240 158l-12 12"/><text class="sub badt" x="170" y="190">Rose, Sun and everyone else wait</text></g>
  <g class="f" data-f="4"><line class="life" x1="8" y1="204" x2="332" y2="204"/><text class="lb" x="170" y="228">B · shuffle sharding: 2 workers each</text><rect class="rec" x="20" y="242" width="300" height="26" rx="7"/><text class="rec-t" x="170" y="259">Big → W1 + W4</text><rect class="rec" x="20" y="276" width="300" height="26" rx="7"/><text class="rec-t" x="170" y="293">Rose → W1 + W8</text><rect class="rec" x="20" y="310" width="300" height="26" rx="7"/><text class="rec-t" x="170" y="327">Sun → W4 + W6</text><text class="sub" x="170" y="356">8 workers give 28 possible pairs</text></g>
