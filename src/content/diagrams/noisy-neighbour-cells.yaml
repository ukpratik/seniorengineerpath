captions:
  - "Path A, a shared pool. Eight workers serve 400 tenants. Every tenant's requests can land on any worker. This is cheap, because no worker sits idle."
  - "The biggest tenant, Big, starts a huge export. Its heavy requests spread over all eight workers and fill every one of them."
  - "Every other tenant now waits behind Big's work. Rose and Sun did nothing wrong, but their pages time out. One tenant's spike became everyone's outage."
  - "Path B, shuffle sharding. Each tenant gets its own random pair of workers. Big has W1 and W4, Rose has W1 and W8, and Sun has W4 and W6. Eight workers give 28 different pairs."
  - "Big's spike now fills only W1 and W4. Rose shares W1 but still has W8. Sun shares W4 but still has W6. If their clients retry on the other worker, they keep working. Only a tenant with Big's exact pair is hurt."
