  <g class="f" data-f="3"><text class="lb" x="34" y="216">1,500/s</text><line class="ln" x1="64" y1="212" x2="110" y2="212"/><rect class="rec" x="116" y="202" width="11" height="20" rx="2"/><rect class="rec" x="130" y="202" width="11" height="20" rx="2"/><rect class="rec" x="144" y="202" width="11" height="20" rx="2"/><rect class="rec" x="158" y="202" width="11" height="20" rx="2"/><rect class="rec" x="172" y="202" width="11" height="20" rx="2"/><rect class="rec" x="186" y="202" width="11" height="20" rx="2"/><rect class="rec" x="200" y="202" width="11" height="20" rx="2"/><rect class="rec" x="214" y="202" width="11" height="20" rx="2"/><rect class="rec" x="228" y="202" width="11" height="20" rx="2"/><line class="ln lost" x1="252" y1="212" x2="268" y2="212"/><rect class="box" x="272" y="196" width="62" height="32" rx="8"/><text class="bt" x="303" y="217">Busy</text><text class="sub badt" x="170" y="246">wait &gt; 1 s · callers give up first</text><text class="sub badt" x="170" y="262">throughput 1,000/s · goodput ≈ 0</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="290">With priority shedding · 1,500/s</text><line class="ln" x1="10" y1="312" x2="56" y2="312"/><rect class="note" x="60" y="300" width="56" height="24" rx="6"/><text class="note-t" x="88" y="316">gate</text><path class="xm" d="M82 332l12 12M94 332l-12 12"/><text class="sub badt" x="150" y="343">prefetch 600/s → 503 at once</text><line class="ln" x1="118" y1="312" x2="146" y2="312"/><rect class="rec" x="150" y="302" width="11" height="20" rx="2"/><line class="ln" x1="252" y1="312" x2="268" y2="312"/><rect class="box" x="272" y="296" width="62" height="32" rx="8"/><text class="bt" x="303" y="317">Server</text><rect class="okb" x="50" y="354" width="240" height="22" rx="8"/><text class="ok-t" x="170" y="370">✓ checkout + pages 900/s · fast</text></g>
  <g class="f" data-f="5"><text class="lb" x="170" y="398">At 3,000/s: shed pages too · checkout still fast</text></g>
captions:
  - "Normal day. 800 requests a second arrive. The server can finish 1,000 a second, so there is almost no queue. Every answer arrives in time: goodput is 800 a second."
  - "A spike: 1,500 requests a second arrive. The server still finishes only 1,000. The extra 500 wait in a queue, so each second the wait gets 0.5 seconds longer."
  - "After about 2 seconds, a new request will wait more than 1 second, so its caller will give up first. Soon after, every answer the server finishes is late. The server is 100% busy and finishes 1,000 requests a second, but nobody reads the answers. Goodput is close to zero."
  - "Now the server sheds by priority. A cheap check at the door rejects the 600 prefetch requests at once with 503. Checkout and page loads, 900 a second, fit inside capacity. The queue stays short and answers come back fast."
  - "Load doubles again, to 3,000 a second. The gate raises its bar and sheds most page loads too. Checkout is a small share of traffic, so it still fits, and users can still pay."
