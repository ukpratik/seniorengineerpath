captions:
  - "Both apps show the newest orders first, 3 per page. Page 1 is orders 9, 8 and 7. A remembers a position: skip 3 next time. B remembers the last order it saw: 7."
  - "Before the user scrolls, a new order, 10, is saved. It goes to the top of the list, so every older order moves down one place."
  - "A asks for rows 4 to 6 by position. Order 7 is now in place 4, so the user sees 7 a second time."
  - "B asks for orders that come after 7 in the sort order. It gets 6, 5 and 4. The new row does not move anything B depends on."
