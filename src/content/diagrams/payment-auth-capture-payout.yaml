  <line class="life" x1="55" y1="54" x2="55" y2="456"/><line class="life" x1="170" y1="54" x2="170" y2="456"/><line class="life" x1="285" y1="54" x2="285" y2="456"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Your shop</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">Processor</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Banks</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="84" x2="166" y2="84"/><text class="lb" x="112" y="76">authorize</text><line class="ln" x1="172" y1="100" x2="281" y2="100"/><text class="sub" x="227" y="94">to issuer</text><rect class="rec" x="240" y="106" width="90" height="26" rx="7"/><text class="rec-t" x="285" y="124">hold ₹1,000</text><line class="ln" x1="168" y1="146" x2="59" y2="146"/><text class="sub" x="112" y="140">webhook</text><rect class="note" x="8" y="152" width="94" height="24" rx="7"/><text class="note-t" x="55" y="168">authorized</text></g>
  <g class="f" data-f="2"><line class="ln" x1="57" y1="202" x2="166" y2="202"/><text class="lb" x="112" y="194">capture</text><text class="sub" x="112" y="218">order ships</text><line class="ln" x1="168" y1="236" x2="59" y2="236"/><text class="sub" x="112" y="230">webhook</text><rect class="note" x="8" y="242" width="94" height="24" rx="7"/><text class="note-t" x="55" y="258">succeeded</text></g>
  <g class="f" data-f="3"><line class="ln" x1="283" y1="292" x2="174" y2="292"/><text class="lb" x="227" y="284">settle</text><text class="sub" x="227" y="308">days later</text><line class="ln" x1="168" y1="324" x2="59" y2="324"/><text class="sub" x="112" y="318">webhook</text><rect class="note" x="8" y="330" width="94" height="24" rx="7"/><text class="note-t" x="55" y="346">available</text></g>
  <g class="f" data-f="4"><line class="ln" x1="172" y1="380" x2="281" y2="380"/><text class="lb" x="227" y="372">payout</text><text class="sub" x="227" y="396">to your bank</text><line class="ln" x1="168" y1="412" x2="59" y2="412"/><text class="sub" x="112" y="406">webhook</text><rect class="note" x="8" y="418" width="94" height="24" rx="7"/><text class="note-t" x="55" y="434">payout paid</text><rect class="okb" x="130" y="418" width="200" height="28" rx="8"/><text class="ok-t" x="230" y="437">✓ match it to the report</text></g>
captions:
  - "The customer pays ₹1,000. Your shop asks the processor to authorize. The issuing bank checks the card and holds ₹1,000. Later a webhook tells your shop the money is held, not yet taken."
  - "The order ships, so your shop captures the payment. Capture must happen before the hold expires. A webhook says the payment succeeded. Your shop still has no money in its bank."
  - "Days later the banks settle. The money reaches the processor, and your balance becomes available. On Stripe, a balance.available event can tell you this. How many days depends on the country and the processor."
  - "The processor sends a payout to your bank account. A webhook says the payout is expected to arrive, and it can still fail later. Your team matches each payout to the processor's report."
