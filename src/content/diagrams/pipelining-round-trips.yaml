id: pipelining-round-trips
title: "Four Redis commands on one connection: one at a time pays 4 round trips, pipelined pays 1"
viewBox: 0 0 340 470
svg: |
  <line class="life" x1="40" y1="36" x2="40" y2="430"/><line class="life" x1="300" y1="36" x2="300" y2="430"/>
  <rect class="box" x="2" y="6" width="76" height="30" rx="8"/><text class="bt" x="40" y="26">Client</text>
  <rect class="box" x="262" y="6" width="76" height="30" rx="8"/><text class="bt" x="300" y="26">Redis</text>
  <text class="lb" x="170" y="54">A · one at a time</text>
  <line class="life" x1="5" y1="300" x2="335" y2="300"/>
  <text class="lb" x="170" y="318">B · pipelined</text>
  <g class="f" data-f="1"><line class="ln" x1="42" y1="62" x2="298" y2="86"/><text class="sub" x="230" y="70">INCR x</text><line class="ln" x1="298" y1="88" x2="42" y2="112"/><text class="sub" x="110" y="94">1</text></g>
  <g class="f" data-f="2"><line class="ln" x1="42" y1="116" x2="298" y2="140"/><line class="ln" x1="298" y1="142" x2="42" y2="166"/><line class="ln" x1="42" y1="170" x2="298" y2="194"/><line class="ln" x1="298" y1="196" x2="42" y2="220"/><line class="ln" x1="42" y1="224" x2="298" y2="248"/><line class="ln" x1="298" y1="250" x2="42" y2="274"/><text class="sub" x="110" y="148">2</text><text class="sub" x="110" y="202">3</text><text class="sub" x="110" y="256">4</text><rect class="note" x="95" y="276" width="150" height="21" rx="7"/><text class="note-t" x="170" y="291">4 round trips</text></g>
  <g class="f" data-f="3"><line class="ln" x1="42" y1="330" x2="298" y2="354"/><line class="ln" x1="42" y1="338" x2="298" y2="362"/><line class="ln" x1="42" y1="346" x2="298" y2="370"/><line class="ln" x1="42" y1="354" x2="298" y2="378"/><text class="sub" x="230" y="338">INCR x ×4</text></g>
  <g class="f" data-f="4"><line class="ln" x1="298" y1="380" x2="42" y2="404"/><line class="ln" x1="298" y1="388" x2="42" y2="412"/><line class="ln" x1="298" y1="396" x2="42" y2="420"/><line class="ln" x1="298" y1="404" x2="42" y2="428"/><text class="sub" x="236" y="420">1, 2, 3, 4</text><rect class="okb" x="85" y="438" width="170" height="26" rx="8"/><text class="ok-t" x="170" y="456">✓ about 1 round trip</text></g>
captions:
  - "A: the client sends INCR x and waits. The reply 1 comes back one full round trip later. Only then can the client send the next command."
  - "A: commands 2, 3 and 4 each wait for the reply before them. Four commands cost four round trips. Redis is idle most of this time."
  - "B: the same four commands, pipelined. The client sends all four at once, without waiting for any reply."
  - "B: Redis answers in order: 1, 2, 3, 4. The client reads all the replies together. The four commands cost about one round trip. Redis must keep the replies in memory until the client reads them."
