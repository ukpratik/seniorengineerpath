id: pool-held-connections
title: "A pool of 4 connections fills up when requests hold connections they are not using"
viewBox: 0 0 340 420
svg: |
  <text class="lb" x="170" y="16">App pool: at most 4 connections</text>
  <g class="f" data-f="1"><text class="lb" x="40" y="52">Normal</text><rect class="okb" x="86" y="34" width="40" height="30" rx="6"/><text class="ok-t" x="106" y="53">query</text><rect class="box" x="130" y="34" width="40" height="30" rx="6"/><text class="bt" x="150" y="53">free</text><rect class="box" x="174" y="34" width="40" height="30" rx="6"/><text class="bt" x="194" y="53">free</text><rect class="box" x="218" y="34" width="40" height="30" rx="6"/><text class="bt" x="238" y="53">free</text><text class="sub" x="298" y="53">~5 ms each</text><text class="sub" x="170" y="82">Borrow, query, give back. Mostly free.</text></g>
  <g class="f" data-f="2"><text class="lb" x="40" y="122">Slow step</text><rect class="okb" x="86" y="104" width="40" height="30" rx="6"/><text class="ok-t" x="106" y="123">query</text><rect class="note" x="130" y="104" width="40" height="30" rx="6"/><text class="note-t" x="150" y="123">held</text><rect class="note" x="174" y="104" width="40" height="30" rx="6"/><text class="note-t" x="194" y="123">held</text><rect class="box" x="218" y="104" width="40" height="30" rx="6"/><text class="bt" x="238" y="123">free</text><text class="sub" x="298" y="123">3 s idle</text><text class="sub" x="170" y="152">Write started, then a slow lookup.</text></g>
  <g class="f" data-f="3"><text class="lb" x="40" y="192">Full</text><rect class="note" x="86" y="174" width="40" height="30" rx="6"/><text class="note-t" x="106" y="193">held</text><rect class="note" x="130" y="174" width="40" height="30" rx="6"/><text class="note-t" x="150" y="193">held</text><rect class="note" x="174" y="174" width="40" height="30" rx="6"/><text class="note-t" x="194" y="193">held</text><rect class="note" x="218" y="174" width="40" height="30" rx="6"/><text class="note-t" x="238" y="193">held</text><text class="sub badt" x="298" y="193">50 wait</text><text class="sub" x="170" y="222">New requests queue for a connection.</text></g>
  <g class="f" data-f="4"><text class="lb" x="40" y="262">Timeout</text><path class="xm" d="M99 250l14 14M113 250l-14 14"/><path class="xm" d="M143 250l14 14M157 250l-14 14"/><path class="xm" d="M187 250l14 14M201 250l-14 14"/><path class="xm" d="M231 250l14 14M245 250l-14 14"/><text class="sub badt" x="298" y="262">errors</text><text class="sub" x="170" y="292">Waits end at the acquire timeout.</text><text class="sub" x="170" y="310">The database may not be busy.</text></g>
  <g class="f" data-f="5"><text class="lb" x="40" y="352">Fix</text><rect class="okb" x="86" y="334" width="40" height="30" rx="6"/><text class="ok-t" x="106" y="353">write</text><rect class="box" x="130" y="334" width="40" height="30" rx="6"/><text class="bt" x="150" y="353">free</text><rect class="box" x="174" y="334" width="40" height="30" rx="6"/><text class="bt" x="194" y="353">free</text><rect class="box" x="218" y="334" width="40" height="30" rx="6"/><text class="bt" x="238" y="353">free</text><rect class="rec" x="40" y="378" width="260" height="28" rx="8"/><text class="rec-t" x="170" y="397">slow lookup first, then borrow</text></g>
captions:
  - "The pool has 4 open connections. A request borrows one, runs a 5 ms query and gives it back. Most of the time, most connections are free."
  - "Some update requests start a write, then wait 3 seconds on a slow lookup. Their connections are borrowed but idle. Nobody else can use them."
  - "A few of those requests take every connection. Each new request now waits in the pool's queue for a connection to come back."
  - "The waits end at the acquire timeout, and the requests fail. The database may be almost idle. The pool is full of connections doing nothing."
  - "The fix: do the slow lookup before you borrow a connection. Hold it only for the write. Now the same traffic leaves 3 connections free."
