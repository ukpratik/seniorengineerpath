captions:
  - "Asha's phone holds a WebSocket to Gateway A. It sends a small heartbeat every 30 seconds to say it is still there."
  - "Asha's train enters a tunnel. The connection dies without a clean close, so the heartbeats just stop. Gateway A waits for three missed beats, 90 seconds, before it decides she is gone."
  - "Gateway A tells the presence service. The presence service is the one owner of Asha's status, and it changes it to offline."
  - "The presence service publishes the change on Asha's channel. Only the gateways with a client that subscribed to Asha get a copy. Gateway B has one. Most gateways get nothing."
  - "Gateway B sends the update to Ravi, who has Asha in his open chat. Meena is in the same team, but Asha is not on her screen, so she did not subscribe and gets nothing."
