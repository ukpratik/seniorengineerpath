id: product-three-contexts
title: "One word, three models: “product” means different things in Catalogue, Billing and Warehouse, so each context owns its own model and translates at the boundary"
viewBox: 0 0 340 420
svg: |
  <text class="lb" x="170" y="16">One word, “product”, in three contexts</text>
  <g class="f" data-f="1"><rect class="box" x="6" y="28" width="100" height="32" rx="8"/><text class="bt" x="56" y="49">Catalogue</text><rect class="box" x="120" y="28" width="100" height="32" rx="8"/><text class="bt" x="170" y="49">Billing</text><rect class="box" x="234" y="28" width="100" height="32" rx="8"/><text class="bt" x="284" y="49">Warehouse</text><text class="sub" x="56" y="78">a page to sell</text><text class="sub" x="56" y="94">title, photos</text><text class="sub" x="170" y="78">a price plan</text><text class="sub" x="170" y="94">price, tax rate</text><text class="sub" x="284" y="78">a stock item</text><text class="sub" x="284" y="94">bin, weight</text></g>
  <g class="f" data-f="2"><rect class="note" x="30" y="110" width="280" height="30" rx="8"/><text class="note-t" x="170" y="130">one products table, one “active” flag</text><text class="sub badt" x="170" y="160">hide a page → warehouse stops restocking</text></g>
  <g class="f" data-f="3"><line class="life" x1="5" y1="176" x2="335" y2="176"/><text class="lb" x="170" y="198">Split: each context owns its model</text><rect class="rec" x="6" y="210" width="100" height="32" rx="8"/><text class="rec-t" x="56" y="231">Listing</text><rect class="rec" x="120" y="210" width="100" height="32" rx="8"/><text class="rec-t" x="170" y="231">PricePlan</text><rect class="rec" x="234" y="210" width="100" height="32" rx="8"/><text class="rec-t" x="284" y="231">Sku</text><text class="sub" x="170" y="262">they share only the productId</text></g>
  <g class="f" data-f="4"><rect class="box" x="6" y="280" width="100" height="32" rx="8"/><text class="bt" x="56" y="301">Catalogue</text><line class="ln" x1="108" y1="296" x2="230" y2="296"/><text class="sub" x="170" y="288">ProductListed {id}</text><rect class="box" x="234" y="280" width="100" height="32" rx="8"/><text class="bt" x="284" y="301">Warehouse</text><rect class="note" x="200" y="322" width="134" height="28" rx="8"/><text class="note-t" x="267" y="341">translate → Sku</text><text class="sub" x="267" y="364">translation layer</text></g>
  <g class="f" data-f="5"><rect class="okb" x="40" y="376" width="260" height="30" rx="8"/><text class="ok-t" x="170" y="396">✓ hiding a page leaves stock alone</text></g>
captions:
  - "Three teams say “product”. To Catalogue it is a page to sell. To Billing it is a price plan. To Warehouse it is a physical item on a shelf. Each needs different fields."
  - "One shared products table forces one meaning on all three. A flag called “active” now means “show the page” to one team and “keep restocking” to another. One change breaks the other team."
  - "Split the model. Each bounded context keeps its own type in its own words: Listing, PricePlan and Sku. They share only the product's ID."
  - "When Catalogue lists a product, it publishes an event with the ID. A small translation layer on the Warehouse side turns it into Warehouse words. Catalogue's model never leaks in."
  - "Now Catalogue can hide a page without touching stock rules. Each word has one meaning inside each context."
