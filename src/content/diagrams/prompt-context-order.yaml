id: prompt-context-order
title: "One request, built in order: fixed parts first, untrusted input fenced, the task last"
viewBox: 0 0 340 520
svg: |
  <rect class="box" x="5" y="8" width="330" height="36" rx="10"/><text class="bt" x="170" y="31">Your app builds one request</text>
  <g class="f" data-f="1"><line class="ln" x1="170" y1="46" x2="170" y2="60"/><rect class="box" x="5" y="64" width="330" height="62" rx="10"/><text class="bt" x="170" y="84">1 · Tools, then system prompt</text><text class="sub" x="170" y="102">tool definitions come first</text><text class="sub" x="170" y="118">system: role · rules and why</text></g>
  <g class="f" data-f="2"><rect class="box" x="5" y="132" width="330" height="46" rx="10"/><text class="bt" x="170" y="152">2 · Examples</text><text class="sub" x="170" y="169">3 to 5, varied, in example tags</text><rect class="note" x="20" y="186" width="300" height="26" rx="7"/><text class="note-t" x="170" y="203">same on every request · cached</text></g>
  <g class="f" data-f="3"><line class="life" x1="5" y1="222" x2="335" y2="222"/><text class="lb" x="170" y="242">changes on every request</text><rect class="rec" x="5" y="252" width="330" height="46" rx="10"/><text class="rec-t" x="170" y="272">3 · Documents</text><text class="sub" x="170" y="289">long text first, in document tags</text></g>
  <g class="f" data-f="4"><rect class="rec" x="5" y="306" width="330" height="56" rx="10"/><text class="rec-t" x="170" y="326">4 · User input, in user_input tags</text><text class="sub badt" x="170" y="344">untrusted: data, not orders</text><text class="sub" x="170" y="357">tags help, but do not stop injection</text></g>
  <g class="f" data-f="5"><rect class="rec" x="5" y="370" width="330" height="40" rx="10"/><text class="rec-t" x="170" y="395">5 · The task, asked last</text></g>
  <g class="f" data-f="6"><line class="ln" x1="170" y1="412" x2="170" y2="428"/><rect class="okb" x="20" y="432" width="300" height="34" rx="8"/><text class="ok-t" x="170" y="454">reply matches your schema</text><rect class="box" x="20" y="474" width="300" height="38" rx="8"/><text class="sub" x="170" y="497">your code checks values and permissions</text></g>
captions:
  - "First come the tool definitions, then the system prompt. The system prompt gives the model a role and the rules, with the reason for each. The output schema is sent as its own setting in the request. Changing it breaks the prompt cache."
  - "Next come a few worked examples. Parts 1 and 2 are the same on every request, so the provider can cache them. One changed character breaks the cache."
  - "Now the parts that change. Long documents, such as search results, go before the question, each one in its own tag."
  - "The user's text goes in its own tag, so the model can tell it from your rules. Treat it as data. Tags make injection harder, but they do not stop it."
  - "The task or question goes at the very end, after the long text. Anthropic and Google both advise this order for long inputs."
  - "The reply follows the schema you sent as a request setting. The schema fixes the shape, not the truth. Your code still checks each value, and checks permissions before any action."
