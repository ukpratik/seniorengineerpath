id: protobuf-old-new-readers
title: "Old and new code share one queue: new fields are skipped, missing fields get defaults, and a reused number gives wrong data"
viewBox: 0 0 340 430
svg: |
  <rect class="box" x="6" y="10" width="110" height="40" rx="10"/><text class="bt" x="61" y="35">v2 pods</text>
  <rect class="box" x="224" y="10" width="110" height="40" rx="10"/><text class="bt" x="279" y="35">v1 pods</text>
  <text class="sub" x="170" y="34">queue</text>
  <g class="f" data-f="1"><line class="ln" x1="118" y1="44" x2="220" y2="44"/><rect class="rec" x="20" y="64" width="300" height="28" rx="8"/><text class="rec-t" x="170" y="83">1: id=42 · 2: amount=500 · 4: "USD"</text><text class="sub" x="170" y="110">v1 has never heard of field 4</text><rect class="okb" x="50" y="118" width="240" height="26" rx="8"/><text class="ok-t" x="170" y="136">✓ v1 skips field 4 and keeps it</text></g>
  <g class="f" data-f="2"><line class="ln" x1="220" y1="20" x2="118" y2="20"/><rect class="rec" x="20" y="156" width="300" height="28" rx="8"/><text class="rec-t" x="170" y="175">1: id=43 · 2: amount=900</text><text class="sub" x="170" y="202">v2 reads: currency not set</text><rect class="okb" x="50" y="210" width="240" height="26" rx="8"/><text class="ok-t" x="170" y="228">✓ v2 sees "not set", picks INR</text></g>
  <g class="f" data-f="3"><line class="ln" x1="118" y1="44" x2="220" y2="44"/><rect class="rec" x="20" y="250" width="300" height="28" rx="8"/><text class="rec-t" x="170" y="269">v3 reuses 2 → 2: discount=50</text><text class="sub" x="170" y="296">old code still reads 2 as amount</text><text class="badt" x="170" y="318">✗ amount = 50. No error.</text></g>
  <g class="f" data-f="4"><rect class="note" x="20" y="334" width="300" height="26" rx="7"/><text class="note-t" x="170" y="351">reserved 2;  discount = 5</text><rect class="okb" x="50" y="370" width="240" height="26" rx="8"/><text class="ok-t" x="170" y="388">✓ old code skips field 5</text><text class="sub" x="170" y="418">Numbers are the contract, not names.</text></g>
captions:
  - "A rolling deploy is half done. A v2 pod writes an order with a new field 4, currency. A v1 pod reads it. It does not know field 4, so it skips it, and proto3 keeps it in the message. This is forward compatibility."
  - "A v1 pod writes an order without field 4. A v2 pod reads it. Because currency is declared optional, v2 can see that it was never set, and pick a safe value. This is backward compatibility."
  - "Months later, someone deletes the old field 2 and gives the number 2 to a new discount field. Old code still thinks field 2 is the amount. It reads 50 as the amount and raises no error."
  - "The fix: mark number 2 as reserved, so the compiler refuses to reuse it, and give the new field a fresh number. Old code skips field 5. The numbers are the contract, not the names."
