id: quorum-overlap-gaps
title: "W + R > N makes read and write sets overlap, but four common gaps still return old or missing data"
viewBox: 0 0 340 462
svg: |
  <g class="f" data-f="1"><text class="lb" x="170" y="18">1 · Write x=2 with W=2 of N=3</text><rect class="rec" x="8" y="28" width="72" height="30" rx="7"/><text class="rec-t" x="44" y="48">A · 2</text><rect class="rec" x="92" y="28" width="72" height="30" rx="7"/><text class="rec-t" x="128" y="48">B · 2</text><rect class="box" x="176" y="28" width="72" height="30" rx="7"/><text class="bt" x="212" y="48">C · 1</text><rect class="okb" x="260" y="28" width="72" height="30" rx="7"/><text class="ok-t" x="296" y="48">✓ ok</text><text class="sub" x="170" y="76">C was slow and missed it. Two yeses are enough.</text></g>
  <g class="f" data-f="2"><text class="lb" x="170" y="108">2 · Read with R=2: ask B and C</text><rect class="rec" x="92" y="118" width="72" height="30" rx="7"/><text class="rec-t" x="128" y="138">B · 2</text><rect class="box" x="176" y="118" width="72" height="30" rx="7"/><text class="bt" x="212" y="138">C · 1</text><rect class="okb" x="260" y="118" width="72" height="30" rx="7"/><text class="ok-t" x="296" y="138">→ 2</text><text class="sub" x="170" y="166">2 + 2 &gt; 3, so B is in both sets.</text><text class="sub" x="170" y="182">The newest value wins. Read repair fixes C.</text></g>
  <g class="f" data-f="3"><text class="lb" x="170" y="202">3 · Sloppy quorum: A and B unreachable</text><rect class="rec" x="176" y="212" width="72" height="30" rx="7"/><text class="rec-t" x="212" y="232">C · 3</text><rect class="rec" x="260" y="212" width="72" height="30" rx="7"/><text class="rec-t" x="296" y="232">D · 3 (A)</text><text class="sub" x="170" y="260">x=3 lands on C and on D, a stand-in for A.</text><text class="sub badt" x="170" y="276">A read from A + B still says 2.</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="296">4 · Write x=4 times out: only A got it</text><rect class="rec" x="8" y="306" width="72" height="30" rx="7"/><text class="rec-t" x="44" y="326">A · 4</text><rect class="box" x="92" y="306" width="72" height="30" rx="7"/><text class="bt" x="128" y="326">B · 3</text><rect class="box" x="176" y="306" width="72" height="30" rx="7"/><text class="bt" x="212" y="326">C · 3</text><path class="xm" d="M289 314l14 14M303 314l-14 14"/><text class="sub" x="170" y="354">The client got an error. A keeps 4 anyway.</text><text class="sub badt" x="170" y="370">Reads may show 3, then 4.</text></g>
  <g class="f" data-f="5"><text class="lb" x="170" y="390">5 · New nodes own the key but are empty</text><rect class="box" x="8" y="400" width="72" height="30" rx="7"/><text class="bt" x="44" y="420">A · 4</text><rect class="box" x="92" y="400" width="72" height="30" rx="7"/><text class="bt" x="128" y="420">E · none</text><rect class="box" x="176" y="400" width="72" height="30" rx="7"/><text class="bt" x="212" y="420">F · none</text><path class="xm" d="M289 408l14 14M303 408l-14 14"/><text class="sub badt" x="170" y="450">A read from E + F: "not found".</text></g>
captions:
  - "Three replicas hold key x (N = 3). You write x=2 and wait for two of them (W = 2). A and B say yes, so the write counts. C was slow and still has the old value, 1."
  - "You read with R = 2 and happen to ask B and C. Because 2 + 2 is more than 3, at least one of them must have the write. B has 2, which is newer, so you get 2. The coordinator also sends 2 to C. That is read repair."
  - "Now the network cuts the coordinator off from A and B. A Dynamo-style sloppy quorum writes x=3 to the first healthy nodes on the list. C and stand-in D answer first; D's copy carries a hint that it belongs to A. Two yeses, so it counts. But a reader who can reach only A and B gets 2."
  - "Later, hints and repair bring A, B and C to 3. Then a write of x=4 reaches only A before the timeout. The client gets an error, but A keeps 4. Nothing rolls it back. A later read that asks A may return 4, so the failed write can still appear."
  - "Last, two new nodes, E and F, join and take ownership of key x before any data is copied to them. The quorum is now two empty nodes. The math still holds, but the answer is wrong. Monzo's 2019 outage put some keys in this state."
