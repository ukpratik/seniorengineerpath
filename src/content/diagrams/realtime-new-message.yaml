captions:
  - "Before the event. A, long polling: the app asks for news and the server holds the request open. B, SSE: the app opens one response that never ends. C, WebSocket: an HTTP Upgrade request gets 101, and the connection stays open."
  - "Someone sends a chat message. The server has it now. It must reach the app in each of the three set-ups."
  - "A answers the waiting request with the message, and that request is finished. B writes one more event into the open response. C sends one WebSocket frame on the open connection."
  - "A must send a new request, or the server has no open request to answer with the next message. B can only receive, so the app sends with a normal POST. C can send on the same connection, for example a typing signal."
