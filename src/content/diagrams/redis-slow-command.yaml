id: redis-slow-command
title: "One slow command on Redis's main thread makes every other client wait"
viewBox: 0 0 340 346
svg: |
  <rect class="box" x="6" y="10" width="80" height="34" rx="8"/><text class="bt" x="46" y="32">Clients</text>
  <rect class="box" x="128" y="10" width="92" height="34" rx="8"/><text class="bt" x="174" y="32">I/O threads</text>
  <rect class="box" x="254" y="10" width="80" height="34" rx="8"/><text class="bt" x="294" y="32">Main thread</text>
  <line class="ln" x1="88" y1="27" x2="124" y2="27"/><line class="ln" x1="222" y1="27" x2="250" y2="27"/>
  <text class="sub" x="174" y="60">read + parse</text><text class="sub" x="294" y="60">runs commands</text>
  <text class="lb" x="170" y="92">Main thread, over time →</text>
  <line class="life" x1="6" y1="130" x2="334" y2="130"/>
  <g class="f" data-f="1"><rect class="okb" x="10" y="104" width="30" height="22" rx="5"/><text class="ok-t" x="25" y="119">GET</text><rect class="okb" x="44" y="104" width="30" height="22" rx="5"/><text class="ok-t" x="59" y="119">GET</text><rect class="okb" x="78" y="104" width="30" height="22" rx="5"/><text class="ok-t" x="93" y="119">GET</text><text class="sub" x="170" y="150">One command at a time, each very short</text></g>
  <g class="f" data-f="2"><rect class="rec" x="112" y="104" width="218" height="22" rx="5"/><text class="rec-t" x="221" y="119">KEYS * on 10 M keys</text><text class="sub badt" x="170" y="168">Nothing else runs until it ends</text></g>
  <g class="f" data-f="3"><rect class="note" x="30" y="182" width="280" height="24" rx="7"/><text class="note-t" x="170" y="198">A, B, C: waiting in line</text><text class="sub badt" x="170" y="226">Timeouts, then retries pile up</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="256">Fix · SCAN in small batches</text><line class="life" x1="6" y1="296" x2="334" y2="296"/><rect class="rec" x="10" y="268" width="44" height="22" rx="5"/><text class="rec-t" x="32" y="283">SCAN</text><rect class="okb" x="58" y="268" width="30" height="22" rx="5"/><text class="ok-t" x="73" y="283">GET</text><rect class="rec" x="92" y="268" width="44" height="22" rx="5"/><text class="rec-t" x="114" y="283">SCAN</text><rect class="okb" x="140" y="268" width="30" height="22" rx="5"/><text class="ok-t" x="155" y="283">GET</text><rect class="rec" x="174" y="268" width="44" height="22" rx="5"/><text class="rec-t" x="196" y="283">SCAN</text><rect class="okb" x="222" y="268" width="30" height="22" rx="5"/><text class="ok-t" x="237" y="283">GET</text><rect class="rec" x="256" y="268" width="44" height="22" rx="5"/><text class="rec-t" x="278" y="283">SCAN</text><rect class="okb" x="60" y="310" width="220" height="26" rx="8"/><text class="ok-t" x="170" y="328">✓ others run between batches</text></g>
captions:
  - "I/O threads (if you turn them on) read and parse requests. But one main thread runs every command, one after another. A GET takes microseconds, so the queue moves fast."
  - "Someone runs KEYS * on a database with 10 million keys. The main thread must walk every key before it can do anything else."
  - "Clients A, B and C sent tiny GETs. Their requests wait in line, even if I/O threads have already read them. Their timeouts fire, and many clients retry, which adds more load."
  - "The fix: SCAN walks the keys a small batch per call. Other commands run between the batches, so nobody waits long."
