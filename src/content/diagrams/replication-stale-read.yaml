id: replication-stale-read
title: "A stale read: the user reads from a follower that is behind"
viewBox: 0 0 340 470
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="456"/><line class="life" x1="170" y1="54" x2="170" y2="456"/><line class="life" x1="285" y1="54" x2="285" y2="456"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">App</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">Leader</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Follower</text>
  <rect class="rec" x="240" y="62" width="90" height="24" rx="7"/><text class="rec-t" x="285" y="78">city: Pune</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="105" x2="166" y2="105"/><text class="lb" x="112" y="96">save city</text><text class="sub" x="112" y="122">city = Delhi</text><line class="ln" x1="168" y1="145" x2="59" y2="145"/><text class="lb" x="112" y="138">OK</text></g>
  <g class="f" data-f="2"><line class="ln lost" x1="172" y1="180" x2="250" y2="180"/><text class="lb" x="227" y="171">copy change</text><text class="sub" x="227" y="197">slow: 3 s lag</text></g>
  <g class="f" data-f="3"><line class="ln" x1="57" y1="230" x2="281" y2="230"/><text class="lb" x="112" y="221">read city</text><text class="sub" x="112" y="247">sent to a follower</text></g>
  <g class="f" data-f="4"><line class="ln" x1="283" y1="280" x2="59" y2="280"/><text class="lb" x="227" y="271">city: Pune</text><text class="sub badt" x="112" y="298">old value!</text><rect class="note" x="8" y="308" width="94" height="26" rx="7"/><text class="note-t" x="55" y="325">save failed?</text></g>
  <g class="f" data-f="5"><line class="ln" x1="250" y1="360" x2="281" y2="360"/><rect class="rec" x="240" y="368" width="90" height="24" rx="7"/><text class="rec-t" x="285" y="384">city: Delhi</text><text class="sub" x="227" y="351">3 s later</text></g>
  <g class="f" data-f="6"><rect class="okb" x="10" y="412" width="320" height="34" rx="8"/><text class="ok-t" x="170" y="434">✓ Fix: read your own data from the leader</text></g>
captions:
  - "The app saves a new city, Delhi, for the user. The write goes to the leader. The leader saves it and says OK."
  - "The leader sends the change to the follower in the background. Today the follower is slow, so the change takes 3 seconds."
  - "The app reloads the profile page. To spread the load, reads go to a follower."
  - "The follower still has the old value, Pune. The user thinks the save failed and may try again or call support."
  - "3 seconds later the change reaches the follower. Now it says Delhi. Nothing was lost; the user just read too early."
  - "One fix: for a short time after a user writes, read that user's own data from the leader. This gives read-your-writes."
