id: retry-amplification
title: "Retries at every layer multiply; one retrying layer with a budget does not"
viewBox: 0 0 340 420
svg: |
  <text class="lb" x="170" y="16">A · Every layer tries up to 4 times</text>
  <rect class="box" x="6" y="28" width="60" height="36" rx="8"/><text class="bt" x="36" y="51">App</text>
  <rect class="box" x="96" y="28" width="60" height="36" rx="8"/><text class="bt" x="126" y="51">Gateway</text>
  <rect class="box" x="186" y="28" width="60" height="36" rx="8"/><text class="bt" x="216" y="51">Service</text>
  <rect class="box" x="276" y="28" width="60" height="36" rx="8"/><text class="bt" x="306" y="51">DB</text>
  <line class="life" x1="5" y1="172" x2="335" y2="172"/>
  <g class="f" data-f="1"><line class="ln" x1="248" y1="46" x2="272" y2="46"/><text class="lb" x="260" y="84">×4</text><text class="sub" x="170" y="110">Service → DB: 4 calls</text></g>
  <g class="f" data-f="2"><line class="ln" x1="158" y1="46" x2="182" y2="46"/><text class="lb" x="170" y="84">×4</text><text class="sub" x="170" y="132">Gateway → Service: 4 × 4 = 16 DB calls</text></g>
  <g class="f" data-f="3"><line class="ln" x1="68" y1="46" x2="92" y2="46"/><text class="lb" x="80" y="84">×4</text><text class="sub badt" x="170" y="156">One tap: 4 × 4 × 4 = 64 DB calls</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="192">B · Only the app retries</text><rect class="box" x="6" y="204" width="60" height="36" rx="8"/><text class="bt" x="36" y="227">App</text><rect class="box" x="96" y="204" width="60" height="36" rx="8"/><text class="bt" x="126" y="227">Gateway</text><rect class="box" x="186" y="204" width="60" height="36" rx="8"/><text class="bt" x="216" y="227">Service</text><rect class="box" x="276" y="204" width="60" height="36" rx="8"/><text class="bt" x="306" y="227">DB</text><line class="ln" x1="68" y1="222" x2="92" y2="222"/><line class="ln" x1="158" y1="222" x2="182" y2="222"/><line class="ln" x1="248" y1="222" x2="272" y2="222"/><text class="lb" x="80" y="260">×4</text><text class="lb" x="170" y="260">×1</text><text class="lb" x="260" y="260">×1</text><rect class="okb" x="70" y="272" width="200" height="28" rx="8"/><text class="ok-t" x="170" y="291">✓ at most 4 DB calls</text></g>
  <g class="f" data-f="5"><rect class="rec" x="40" y="318" width="260" height="28" rx="8"/><text class="rec-t" x="170" y="337">budget: retries ≤ 10% of requests</text><text class="sub" x="170" y="366">DB down for everyone?</text><text class="sub" x="170" y="384">Most retries are skipped. They fail fast.</text><rect class="okb" x="70" y="392" width="200" height="26" rx="8"/><text class="ok-t" x="170" y="410">✓ load ≈ 1.1×, not 4×</text></g>
captions:
  - "Each layer makes 1 try plus up to 3 retries: 4 attempts. The database is down. The service tries it 4 times before it gives up."
  - "The gateway also tries the service 4 times. Each of those tries makes 4 database calls. That is 16."
  - "The app tries the gateway 4 times too. One tap now sends up to 64 calls to a database that is already failing. Count attempts, not retries."
  - "The fix: retry in one layer only. The gateway and the service try once and pass the error up. The app retries, so the database gets at most 4 calls."
  - "Add a retry budget. A client retries only while retries stay under 10% of its requests. In a full outage, total load stays near 1.1×, not 4×."
