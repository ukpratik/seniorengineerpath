  <g class="f" data-f="8"><line class="ln" x1="228" y1="386" x2="246" y2="386"/><rect class="box" x="248" y="364" width="87" height="44" rx="10"/><text class="bt" x="291" y="391">Topic</text><rect class="okb" x="148" y="436" width="187" height="28" rx="8"/><text class="ok-t" x="241" y="455">✓ sent only if saved</text></g>
captions:
  - "Priya places order 42. The order saga saves it in the order database with the state pending. Each step from here is its own local transaction."
  - "The saga asks Inventory to hold one item. Inventory commits that in its own database. Nothing is locked across services."
  - "The saga asks Payments to charge ₹1,499. The card is declined. There is no global rollback, so the saga must undo the earlier steps itself."
  - "First compensating action: the saga tells Inventory to release the item. Inventory commits a new change. It does not erase history."
  - "Second compensating action: the saga marks the order cancelled. Steps are undone in reverse order. Priya sees a clear message, not a stuck order."
  - "How does each step send its event safely? The Order service writes the order row and an outbox row in the same database transaction. Both are saved, or neither is."
  - "A separate relay reads new outbox rows. A CDC tool like Debezium does this by reading the database's change log, not by polling the table."
  - "The relay publishes the event to a topic. If the transaction rolled back, there is no outbox row, so no event. The relay may send a row twice, so consumers skip duplicate event IDs."
