  <g class="f" data-f="3"><line class="ln" x1="57" y1="172" x2="281" y2="172"/><text class="lb" x="227" y="163">charge ₹1,499</text><path class="xm" d="M278 180l14 14M292 180l-14 14"/><text class="sub badt" x="285" y="212">declined</text></g>
  <g class="f" data-f="4"><line class="ln" x1="57" y1="234" x2="166" y2="234"/><text class="lb" x="112" y="225">release item</text><rect class="rec" x="122" y="244" width="96" height="26" rx="7"/><text class="rec-t" x="170" y="261">0 held</text></g>
  <g class="f" data-f="5"><rect class="rec" x="7" y="272" width="96" height="26" rx="7"/><text class="rec-t" x="55" y="289">cancelled</text><text class="sub" x="227" y="289">undo, newest first</text></g>
