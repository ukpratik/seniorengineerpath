id: saml-sp-initiated-login
title: "One SP-initiated SAML login: find the tenant's IdP, then check the answer before you trust it"
viewBox: 0 0 340 500
svg: |
  <line class="life" x1="55" y1="54" x2="55" y2="486"/><line class="life" x1="170" y1="54" x2="170" y2="486"/><line class="life" x1="285" y1="54" x2="285" y2="486"/>
  <rect class="box" x="5" y="10" width="100" height="44" rx="10"/><text class="bt" x="55" y="37">Browser</text>
  <rect class="box" x="120" y="10" width="100" height="44" rx="10"/><text class="bt" x="170" y="37">App (SP)</text>
  <rect class="box" x="235" y="10" width="100" height="44" rx="10"/><text class="bt" x="285" y="37">Acme's IdP</text>
  <g class="f" data-f="1"><line class="ln" x1="57" y1="86" x2="166" y2="86"/><text class="lb" x="112" y="77">asha@acme.com</text><rect class="rec" x="122" y="98" width="96" height="44" rx="7"/><text class="rec-t" x="170" y="116">acme.com ✓</text><text class="rec-t" x="170" y="133">→ tenant 42</text></g>
  <g class="f" data-f="2"><line class="ln" x1="168" y1="168" x2="59" y2="168"/><text class="lb" x="112" y="160">redirect</text><line class="ln" x1="57" y1="196" x2="281" y2="196"/><text class="lb" x="170" y="188">AuthnRequest ID=r7</text></g>
  <g class="f" data-f="3"><rect class="note" x="240" y="210" width="90" height="26" rx="7"/><text class="note-t" x="285" y="227">login + MFA</text><line class="ln" x1="283" y1="258" x2="59" y2="258"/><text class="lb" x="170" y="250">signed Response</text><line class="ln" x1="57" y1="284" x2="166" y2="284"/><text class="lb" x="112" y="276">POST /acs</text></g>
  <g class="f" data-f="4"><rect class="rec" x="60" y="298" width="220" height="104" rx="7"/><text class="rec-t" x="170" y="316">signature: tenant cert</text><text class="rec-t" x="170" y="334">used = signed</text><text class="rec-t" x="170" y="352">Audience = us</text><text class="rec-t" x="170" y="370">InResponseTo = r7</text><text class="rec-t" x="170" y="388">time ± skew</text></g>
  <g class="f" data-f="5"><text class="sub" x="170" y="424">key: (tenant 42, persistent ID)</text><text class="sub" x="170" y="442">not the email</text><rect class="okb" x="70" y="452" width="200" height="30" rx="8"/><text class="ok-t" x="170" y="472">✓ session for Asha</text></g>
captions:
  - "Asha types her work email. Your app finds acme.com in its list of verified domains. That domain belongs to tenant 42, which uses its own identity provider (IdP)."
  - "Your app is the service provider (SP). It sends the browser to tenant 42's IdP with a SAML AuthnRequest. The request has an ID, here r7. The app remembers it."
  - "Asha logs in at her company's IdP, with MFA. The IdP signs a SAML Response that holds an assertion about her. The browser posts it to your app's assertion consumer service URL."
  - "Now the checks. Verify the signature with the certificate stored for tenant 42. Read data only from the signed element. Check the audience, InResponseTo r7 and the time window, with a small skew allowance."
  - "Only now find the user. Key the account on the tenant and a persistent ID from the IdP that is never reassigned, not on the email. Then create a normal session, as in the login lesson."
