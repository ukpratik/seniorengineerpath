  <g class="f" data-f="3"><line class="life" x1="8" y1="210" x2="332" y2="210"/><rect class="rec" x="20" y="222" width="300" height="30" rx="8"/><text class="rec-t" x="170" y="242">B · validate: format, size, speed test</text><text class="sub" x="210" y="272">passes: bug shows only on real traffic</text><rect class="box" x="8" y="290" width="72" height="40" rx="8"/><text class="bt" x="44" y="307">Canary</text><text class="sub" x="44" y="323">1%</text><rect class="box" x="92" y="290" width="72" height="40" rx="8"/><text class="bt" x="128" y="307">Wave 1</text><text class="sub" x="128" y="323">10%</text><rect class="box" x="176" y="290" width="72" height="40" rx="8"/><text class="bt" x="212" y="307">Wave 2</text><text class="sub" x="212" y="323">50%</text><rect class="box" x="260" y="290" width="72" height="40" rx="8"/><text class="bt" x="296" y="307">Wave 3</text><text class="sub" x="296" y="323">100%</text></g>
  <g class="f" data-f="4"><line class="ln" x1="44" y1="256" x2="44" y2="286"/><rect class="note" x="8" y="290" width="72" height="40" rx="8"/><text class="note-t" x="44" y="307">Canary</text><text class="note-t" x="44" y="323">1%</text><text class="sub badt" x="44" y="350">errors up</text><text class="sub" x="44" y="366">CPU 100%</text></g>
  <g class="f" data-f="5"><text class="sub" x="212" y="350">waves never get v42</text><text class="lb" x="212" y="372">auto rollback</text><rect class="okb" x="20" y="394" width="300" height="32" rx="8"/><text class="ok-t" x="170" y="415">✓ Caught at 1%, undone in minutes</text></g>
captions:
  - "Path A, a global push. A new config passes its tests. The config system sends it to every server in every region within seconds."
  - "The config has a hidden bug that uses all the CPU. Every region fails at the same time, so every user is hit."
  - "Path B, a staged rollout. First, a machine validates the file: format, size and a quick speed test. Some bugs show up only on real traffic, so assume a few will pass."
  - "The config goes to the canary first: 1% of servers. During bake time, health checks compare the canary with the rest. Errors and CPU jump."
  - "The health check fails, so the system rolls the canary back and stops the rollout. The other 99% never got the bad config. A few users saw errors for minutes, not the whole world."
