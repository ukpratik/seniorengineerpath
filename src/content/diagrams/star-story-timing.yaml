id: star-story-timing
title: "One STAR story in two to three minutes: where the time goes"
viewBox: 0 0 340 410
svg: |
  <text class="lb" x="170" y="16">≈ 150 seconds, one story</text>
  <rect class="box" x="10" y="24" width="320" height="26" rx="6"/>
  <g class="f" data-f="1"><rect class="rec" x="10" y="24" width="43" height="26" rx="6"/><text class="rec-t" x="31" y="41">S</text><rect class="rec" x="10" y="62" width="320" height="52" rx="10"/><text class="rec-t" x="170" y="84">S · Situation · ~20 s</text><text class="sub" x="170" y="103">team · system · why it mattered</text></g>
  <g class="f" data-f="2"><rect class="rec" x="53" y="24" width="32" height="26" rx="6"/><text class="rec-t" x="69" y="41">T</text><rect class="box" x="10" y="122" width="320" height="52" rx="10"/><text class="bt" x="170" y="144">T · Task · ~15 s</text><text class="sub" x="170" y="163">your goal · your part in it</text></g>
  <g class="f" data-f="3"><rect class="rec" x="85" y="24" width="192" height="26" rx="6"/><text class="rec-t" x="181" y="41">A · the longest part</text><rect class="box" x="10" y="182" width="320" height="52" rx="10"/><text class="bt" x="170" y="204">A · Action · ~90 s</text><text class="sub" x="170" y="223">what I did · the options · why this one</text></g>
  <g class="f" data-f="4"><rect class="okb" x="277" y="24" width="53" height="26" rx="6"/><text class="ok-t" x="303" y="41">R</text><rect class="okb" x="10" y="242" width="320" height="52" rx="10"/><text class="ok-t" x="170" y="264">✓ R · Result · ~25 s</text><text class="sub" x="170" y="283">a number · what I learned</text></g>
  <g class="f" data-f="5"><line class="ln" x1="170" y1="298" x2="170" y2="314"/><rect class="note" x="10" y="318" width="320" height="80" rx="10"/><text class="note-t" x="170" y="340">Then the follow-ups</text><text class="sub" x="170" y="362">"What did you do yourself?"</text><text class="sub" x="170" y="382">"What would you change now?"</text></g>
captions:
  - "Start with just enough context: the team, the system and why the problem mattered. About 20 seconds. Weak stories often spend far too long here."
  - "Say what your goal was and what your part was. About 15 seconds. The listener now knows what to judge you on."
  - "Spend most of the time on your actions. Say what you did, which options you saw, and why you chose one. Use “I” for your own work."
  - "End with the result. Give a number if you have one, then one thing you learned. Without this part, the interviewer has no outcome to write down."
  - "Stop and let the interviewer ask. Follow-up questions are where they check the details. A true story holds up here; a vague one does not."
