id: tech-debt-register
title: "One debt item: from noticed to paid down"
viewBox: 0 0 340 540
svg: |
  <g class="f" data-f="1"><rect class="box" x="20" y="10" width="300" height="70" rx="10"/><text class="bt" x="170" y="32">1 · Noticed</text><text class="sub" x="170" y="51">"Discount logic is copied in 3 places"</text><text class="sub" x="170" y="69">added to the debt register</text></g>
  <g class="f" data-f="2"><line class="ln" x1="170" y1="82" x2="170" y2="104"/><rect class="box" x="20" y="108" width="300" height="88" rx="10"/><text class="bt" x="170" y="130">2 · Interest measured</text><text class="sub" x="170" y="149">each offer change: 3 days, not 1</text><text class="sub" x="170" y="167">changed 40 times last year</text><text class="sub" x="170" y="185">2 incidents in 6 months</text><rect class="note" x="200" y="200" width="130" height="26" rx="7"/><text class="note-t" x="265" y="217">a hotspot</text></g>
  <g class="f" data-f="3"><line class="ln" x1="170" y1="198" x2="170" y2="234"/><rect class="rec" x="20" y="238" width="300" height="70" rx="10"/><text class="rec-t" x="170" y="260">3 · Prioritized with the PM</text><text class="sub" x="170" y="279">8 offer changes planned this quarter</text><text class="sub" x="170" y="297">2 days of cleanup per sprint, agreed</text></g>
  <g class="f" data-f="4"><line class="ln" x1="170" y1="310" x2="170" y2="332"/><rect class="box" x="20" y="336" width="300" height="88" rx="10"/><text class="bt" x="170" y="358">4 · Paid down in steps</text><text class="sub" x="170" y="377">sprint 1: tests around all 3 copies</text><text class="sub" x="170" y="395">sprint 2: one shared discount module</text><text class="sub" x="170" y="413">sprint 3: delete the old copies</text></g>
  <g class="f" data-f="5"><line class="ln" x1="170" y1="426" x2="170" y2="448"/><rect class="okb" x="20" y="452" width="300" height="76" rx="10"/><text class="ok-t" x="170" y="474">5 · Interest drops</text><text class="sub" x="170" y="494">each offer change: 1 day</text><text class="sub" x="170" y="512">0 pricing incidents next quarter</text></g>
captions:
  - "An engineer notices that the discount logic is copied in three places. She adds one line to the team's debt register. Nothing is fixed yet."
  - "The team measures the interest. Each offer change takes 3 days instead of 1. The code changed 40 times last year and caused 2 incidents. It is a hotspot."
  - "The team compares the item with planned features. Eight offer changes are coming, so the cleanup pays back soon. The PM agrees to 2 days of cleanup per sprint."
  - "The debt is paid in small steps that each ship alone. First tests, then one shared module, then deleting the old copies. Features keep shipping."
  - "The team measures again. Offer changes now take 1 day, and there are no pricing incidents. The register item is closed."
