id: toil-automation-ladder
title: "One repeated task moves up the automation ladder, and the human minutes per week fall"
viewBox: 0 0 340 372
svg: |
  <text class="lb" x="170" y="18">Made-up example: one task, 6 times a week</text>
  <text class="sub" x="83" y="38">step</text>
  <text class="sub" x="250" y="38">human minutes per week</text>
  <g class="f" data-f="1"><rect class="rec" x="8" y="46" width="150" height="40" rx="8"/><text class="rec-t" x="83" y="63">1 · From memory</text><text class="sub" x="83" y="79">ssh in, guess, delete</text><rect class="note" x="166" y="56" width="108" height="20" rx="4"/><text class="sub" x="305" y="70">120 min</text></g>
  <g class="f" data-f="2"><rect class="rec" x="8" y="108" width="150" height="40" rx="8"/><text class="rec-t" x="83" y="125">2 · Runbook</text><text class="sub" x="83" y="141">same steps every time</text><rect class="note" x="166" y="118" width="65" height="20" rx="4"/><text class="sub" x="262" y="132">72 min</text></g>
  <g class="f" data-f="3"><rect class="rec" x="8" y="170" width="150" height="40" rx="8"/><text class="rec-t" x="83" y="187">3 · Script</text><text class="sub" x="83" y="203">one command, one check</text><rect class="note" x="166" y="180" width="22" height="20" rx="4"/><text class="sub" x="219" y="194">24 min</text></g>
  <g class="f" data-f="4"><rect class="rec" x="8" y="232" width="150" height="40" rx="8"/><text class="rec-t" x="83" y="249">4 · Auto-remediation</text><text class="sub" x="83" y="265">pages a human if unsafe</text><rect class="note" x="166" y="242" width="5" height="20" rx="2"/><text class="sub" x="205" y="256">~6 min</text></g>
  <g class="f" data-f="5"><rect class="rec" x="8" y="294" width="150" height="40" rx="8"/><text class="rec-t" x="83" y="311">5 · Fix the cause</text><text class="sub" x="83" y="327">log rotation built in</text><rect class="okb" x="166" y="300" width="166" height="28" rx="8"/><text class="ok-t" x="249" y="319">✓ 0 min: task gone</text></g>
captions:
  - "A made-up example. A worker's disk fills about 6 times a week. Each time, someone logs in and finds what to delete from memory. That takes about 20 minutes, so 2 hours a week."
  - "The team writes a runbook with exact, tested commands. Nobody has to think about the order any more. Each run now takes about 12 minutes. The numbers are a made-up example."
  - "The runbook steps become a script with one safety check at the start. A person still starts it, but each run takes about 4 minutes. Self-service is left out here: it moves the work to other teams."
  - "The alert now runs the script by itself. The script has limits, such as how many files it may delete. If a limit is hit, it stops and pages a human. Say that happens about once a week, for about 6 minutes."
  - "Best of all, remove the cause. With log rotation set up, the disk never fills, and the task disappears. Google's workbook calls this the optimal strategy."
