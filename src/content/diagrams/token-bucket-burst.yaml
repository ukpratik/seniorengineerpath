id: token-bucket-burst
title: "A token bucket: a burst drains it, then it refills one token a second"
viewBox: 0 0 340 470
svg: |
  <rect class="box" x="40" y="10" width="260" height="44" rx="10"/><text class="bt" x="170" y="30">Bucket for one API key</text><text class="sub" x="170" y="46">holds 5 tokens · +1 token per second</text>
  <g class="f" data-f="1"><text class="lb" x="40" y="96">t = 0 s</text><rect class="rec" x="90" y="80" width="20" height="20" rx="4"/><rect class="rec" x="116" y="80" width="20" height="20" rx="4"/><rect class="rec" x="142" y="80" width="20" height="20" rx="4"/><rect class="rec" x="168" y="80" width="20" height="20" rx="4"/><rect class="rec" x="194" y="80" width="20" height="20" rx="4"/><text class="sub" x="275" y="95">full: 5 tokens</text></g>
  <g class="f" data-f="2"><text class="lb" x="40" y="156">burst</text><rect class="box" x="90" y="140" width="20" height="20" rx="4"/><rect class="box" x="116" y="140" width="20" height="20" rx="4"/><rect class="box" x="142" y="140" width="20" height="20" rx="4"/><rect class="box" x="168" y="140" width="20" height="20" rx="4"/><rect class="box" x="194" y="140" width="20" height="20" rx="4"/><text class="sub" x="275" y="148">requests 1–5</text><text class="sub" x="275" y="164">✓ allowed</text><text class="sub" x="152" y="182">each request takes 1 token</text></g>
  <g class="f" data-f="3"><text class="lb" x="40" y="222">t = 0 s</text><path class="xm" d="M140 208l14 14M154 208l-14 14"/><text class="sub badt" x="260" y="214">requests 6–7: 429</text><rect class="note" x="200" y="226" width="124" height="26" rx="7"/><text class="note-t" x="262" y="243">Retry-After: 1</text></g>
  <g class="f" data-f="4"><text class="lb" x="40" y="296">t = 1 s</text><rect class="rec" x="90" y="280" width="20" height="20" rx="4"/><rect class="box" x="116" y="280" width="20" height="20" rx="4"/><rect class="box" x="142" y="280" width="20" height="20" rx="4"/><rect class="box" x="168" y="280" width="20" height="20" rx="4"/><rect class="box" x="194" y="280" width="20" height="20" rx="4"/><text class="sub" x="275" y="288">+1 token</text><text class="sub" x="275" y="304">request 8 ✓</text></g>
  <g class="f" data-f="5"><text class="lb" x="40" y="356">t = 7 s</text><rect class="rec" x="90" y="340" width="20" height="20" rx="4"/><rect class="rec" x="116" y="340" width="20" height="20" rx="4"/><rect class="rec" x="142" y="340" width="20" height="20" rx="4"/><rect class="rec" x="168" y="340" width="20" height="20" rx="4"/><rect class="rec" x="194" y="340" width="20" height="20" rx="4"/><text class="sub" x="275" y="348">quiet 6 s</text><text class="sub" x="275" y="364">full, stops at 5</text><rect class="okb" x="20" y="392" width="300" height="32" rx="8"/><text class="ok-t" x="170" y="413">✓ burst of 5, then 1 per second</text></g>
captions:
  - "Each API key has its own bucket. It holds at most 5 tokens, and it gets 1 new token every second. At the start it is full."
  - "A burst of 7 requests arrives at once. Each request takes one token. Requests 1 to 5 get a token and go through. Now the bucket is empty."
  - "Requests 6 and 7 find no token. The server answers at once with 429 Too Many Requests and Retry-After: 1, meaning: try again in 1 second."
  - "One second later, one token has been added. Request 8 takes it and goes through. The bucket is empty again."
  - "The client goes quiet for 6 seconds. The bucket refills, but it stops at 5 tokens. So a client can send a burst of up to 5, but on average only 1 request a second."
