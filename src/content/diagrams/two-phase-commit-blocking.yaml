id: two-phase-commit-blocking
title: "Two-phase commit: both databases vote yes, the coordinator dies, and the rows stay locked"
viewBox: 0 0 340 400
svg: |
  <rect class="box" x="110" y="10" width="120" height="40" rx="10"/><text class="bt" x="170" y="35">Coordinator</text>
  <rect class="box" x="10" y="196" width="120" height="40" rx="10"/><text class="bt" x="70" y="221">Orders DB</text>
  <rect class="box" x="210" y="196" width="120" height="40" rx="10"/><text class="bt" x="270" y="221">Stock DB</text>
  <g class="f" data-f="1"><line class="ln" x1="150" y1="52" x2="78" y2="192"/><line class="ln" x1="190" y1="52" x2="262" y2="192"/><text class="lb" x="78" y="112">PREPARE</text><text class="lb" x="262" y="112">PREPARE</text></g>
  <g class="f" data-f="2"><text class="lb" x="52" y="168">YES</text><text class="lb" x="288" y="168">YES</text><rect class="rec" x="12" y="244" width="116" height="26" rx="7"/><text class="rec-t" x="70" y="261">prepared, locked</text><rect class="rec" x="212" y="244" width="116" height="26" rx="7"/><text class="rec-t" x="270" y="261">prepared, locked</text></g>
  <g class="f" data-f="3"><rect class="rec" x="238" y="14" width="98" height="32" rx="7"/><text class="rec-t" x="287" y="34">log: COMMIT</text><path class="xm" d="M84 16l18 18M102 16l-18 18"/><text class="sub badt" x="93" y="56">crashed</text></g>
  <g class="f" data-f="4"><rect class="note" x="10" y="282" width="320" height="30" rx="8"/><text class="note-t" x="170" y="301">In doubt: commit or abort? Rows stay locked.</text><text class="sub" x="170" y="330">Other orders wait. Neither DB may guess.</text></g>
  <g class="f" data-f="5"><rect class="okb" x="10" y="344" width="320" height="28" rx="8"/><text class="ok-t" x="170" y="363">✓ Fix: replicate the coordinator's log</text><text class="sub" x="170" y="390">The replicated log still has COMMIT.</text></g>
captions:
  - "Order 42 must change two databases. The coordinator sends PREPARE to both. Each one writes the changes to disk, but does not commit yet."
  - "Both databases vote YES. A YES is a promise: I can commit, even after a crash. To keep that promise, each one keeps its row locks."
  - "The coordinator writes COMMIT to its own log. That is the decision. Then its machine dies before it tells anyone."
  - "Both databases are now in doubt. They voted YES, so they may not abort alone. They do not know the decision, so they may not commit. Locked rows block other orders."
  - "Classic 2PC waits for the coordinator to come back. Spanner and CockroachDB store the decision in a Paxos or Raft group instead, so it survives one machine dying and the commit can still finish."
