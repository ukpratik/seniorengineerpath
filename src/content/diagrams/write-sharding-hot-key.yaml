id: write-sharding-hot-key
title: "Split one hot counter key into sub-keys, then add them up on read"
viewBox: 0 0 340 430
svg: |
  <text class="lb" x="170" y="16">Likes on one post: 3,000 writes/s</text>
  <rect class="box" x="8" y="28" width="74" height="36" rx="8"/><text class="bt" x="45" y="51">P1</text>
  <rect class="box" x="90" y="28" width="74" height="36" rx="8"/><text class="bt" x="127" y="51">P2</text>
  <rect class="box" x="172" y="28" width="74" height="36" rx="8"/><text class="bt" x="209" y="51">P3</text>
  <rect class="box" x="254" y="28" width="74" height="36" rx="8"/><text class="bt" x="291" y="51">P4</text>
  <text class="sub" x="170" y="82">each partition: at most 1,000 writes/s</text>
  <g class="f" data-f="1"><rect class="rec" x="90" y="94" width="74" height="24" rx="6"/><text class="rec-t" x="127" y="110">post42</text><text class="sub badt" x="127" y="134">3,000/s</text><text class="sub badt" x="170" y="156">2,000 writes/s throttled</text><text class="sub" x="170" y="174">P1, P3 and P4 sit idle</text></g>
  <g class="f" data-f="2"><text class="lb" x="170" y="200">Split into 4 sub-keys</text><rect class="rec" x="8" y="210" width="74" height="24" rx="6"/><text class="rec-t" x="45" y="226">post42#0</text><rect class="rec" x="90" y="210" width="74" height="24" rx="6"/><text class="rec-t" x="127" y="226">post42#1</text><rect class="rec" x="172" y="210" width="74" height="24" rx="6"/><text class="rec-t" x="209" y="226">post42#2</text><rect class="rec" x="254" y="210" width="74" height="24" rx="6"/><text class="rec-t" x="291" y="226">post42#3</text><text class="sub" x="170" y="252">each like picks one at random: ≈750/s each</text><text class="ok-t" x="170" y="272">✓ writes spread over 4 partitions</text></g>
  <g class="f" data-f="3"><text class="lb" x="170" y="300">Read: get all 4, then add</text><text class="sub" x="170" y="320">762 + 741 + 749 + 748 = 3,000</text><text class="sub badt" x="170" y="340">4 reads instead of 1</text></g>
  <g class="f" data-f="4"><rect class="okb" x="10" y="356" width="320" height="28" rx="8"/><text class="ok-t" x="170" y="375">job adds them every 5 s → one total row</text><rect class="note" x="10" y="392" width="320" height="28" rx="8"/><text class="note-t" x="170" y="411">pages read 1 row, but it can be 5 s old</text></g>
captions:
  - "A viral post gets 3,000 likes a second. Its counter is one key, so it lives on one partition. That partition takes at most 1,000 writes a second. The rest are throttled, while the other partitions do nothing."
  - "Split the key into 4 sub-keys: post42#0 to post42#3. Each like adds 1 to a random sub-key. The hash spreads the sub-keys over the partitions. Each sub-key takes about 750 writes a second, under the limit. Use more sub-keys for more headroom."
  - "The cost moves to reads. To show the count, you read every sub-key and add them up. Four sub-keys mean four reads, and 50 would mean 50."
  - "If reads are frequent, a small job adds the sub-keys every few seconds and stores one total. Pages read that one row. The price is a count that can be a few seconds old."
