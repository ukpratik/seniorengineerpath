  <g class="f" data-f="1"><line class="ln" x1="170" y1="42" x2="170" y2="120"/><rect class="box" x="120" y="124" width="100" height="44" rx="10"/><text class="bt" x="170" y="143">One server</text><text class="sub" x="170" y="159">app + DB</text></g>
  <g class="f" data-f="2"><rect class="box" x="120" y="124" width="100" height="44" rx="10"/><text class="bt" x="170" y="150">App server</text><line class="ln" x1="170" y1="168" x2="170" y2="258"/><rect class="box" x="120" y="262" width="100" height="40" rx="10"/><text class="bt" x="170" y="287">Database</text></g>
