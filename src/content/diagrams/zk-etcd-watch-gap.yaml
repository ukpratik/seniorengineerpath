id: zk-etcd-watch-gap
title: "A standard ZooKeeper watch fires once; an etcd watch replays from a revision"
viewBox: 0 0 340 430
svg: |
  <text class="lb" x="170" y="16">A · ZooKeeper: a standard watch</text>
  <rect class="box" x="10" y="26" width="90" height="32" rx="8"/><text class="bt" x="55" y="47">Client</text>
  <rect class="box" x="240" y="26" width="90" height="32" rx="8"/><text class="bt" x="285" y="47">ZooKeeper</text>
  <line class="life" x1="55" y1="58" x2="55" y2="196"/>
  <line class="life" x1="285" y1="58" x2="285" y2="196"/>
  <g class="f" data-f="1"><line class="ln" x1="58" y1="78" x2="282" y2="78"/><text class="sub" x="170" y="72">getData /cfg, watch = true</text><line class="ln" x1="282" y1="100" x2="58" y2="100"/><text class="sub" x="170" y="94">v1</text></g>
  <g class="f" data-f="2"><rect class="note" x="245" y="108" width="80" height="20" rx="6"/><text class="note-t" x="285" y="122">v1 → v2</text><line class="ln" x1="282" y1="136" x2="58" y2="136"/><text class="sub" x="170" y="130">event: /cfg changed</text><text class="sub" x="170" y="152">The watch is now gone.</text></g>
  <g class="f" data-f="3"><rect class="note" x="245" y="156" width="80" height="20" rx="6"/><text class="note-t" x="285" y="170">v2 → v3</text><line class="ln" x1="58" y1="184" x2="282" y2="184"/><text class="sub" x="170" y="178">getData, watch = true → v3</text><text class="sub badt" x="170" y="212">You saw v3. You never saw v2.</text></g>
  <g class="f" data-f="4"><text class="lb" x="170" y="240">B · etcd: watch from a revision</text><rect class="box" x="10" y="250" width="90" height="32" rx="8"/><text class="bt" x="55" y="271">Client</text><rect class="box" x="240" y="250" width="90" height="32" rx="8"/><text class="bt" x="285" y="271">etcd</text><line class="life" x1="55" y1="282" x2="55" y2="370"/><line class="life" x1="285" y1="282" x2="285" y2="370"/><line class="ln" x1="58" y1="302" x2="282" y2="302"/><text class="sub" x="170" y="296">Watch /cfg from rev 7</text><line class="ln" x1="282" y1="324" x2="58" y2="324"/><text class="sub" x="170" y="318">rev 7 PUT, rev 8 PUT</text><rect class="okb" x="70" y="332" width="200" height="24" rx="8"/><text class="ok-t" x="170" y="349">✓ every change, in order</text></g>
  <g class="f" data-f="5"><line class="ln" x1="58" y1="370" x2="282" y2="370"/><text class="sub" x="170" y="364">reconnect: Watch from rev 9</text><rect class="rec" x="20" y="382" width="300" height="40" rx="8"/><text class="rec-t" x="170" y="398">In history? The missed events arrive.</text><text class="rec-t" x="170" y="414">Compacted? Watch canceled. Read again.</text></g>
captions:
  - "The client reads /cfg and sets a watch in the same call. It gets version 1."
  - "Someone writes version 2. ZooKeeper sends one event. A standard watch fires once and is then removed."
  - "Before the client reads again and sets a new watch, a third write lands. The client reads version 3. It never sees version 2."
  - "In etcd you ask for every change from a revision. Events come ordered by revision, with the new values, and the watch keeps running."
  - "If the stream breaks, you start a new watch after the last revision you saw. If compaction removed that history, etcd cancels the watch. You must read the current state and watch from there."
